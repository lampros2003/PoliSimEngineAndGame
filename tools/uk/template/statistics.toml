next = "select(real_gdp_at_start < 0.0, real_gdp, real_gdp_at_start)"

[state.household_emissions_at_start]
doc = "Households' emissions in the base month; -1 until known"
type = "real"
unit = "tonne/month"
phase = "accounts"
initial = -1.0
next = "select(household_emissions_at_start < 0.0, household_emissions, household_emissions_at_start)"

# ---- inequality: the Gini coefficient of equivalised net income across people, from the
# households, by the Lorenz curve at each tenth (exact at the tenths, straight between them,
# which puts it a little low), scaled so the base month is HBAI's 35%.

[var.income_tenth_1]
type = "real"
unit = "GBP/month/household"
phase = "income"
expr = "quantile(household, equivalised_income, 0.1, people)"

[var.lorenz_1]
type = "real"
unit = "1"
phase = "income"
expr = "wsum(household, select(equivalised_income <= income_tenth_1, people * equivalised_income, 0.0)) / wsum(household, people * equivalised_income)"

[var.income_tenth_2]
type = "real"
unit = "GBP/month/household"
phase = "income"
expr = "quantile(household, equivalised_income, 0.2, people)"

[var.lorenz_2]
type = "real"
unit = "1"
phase = "income"
expr = "wsum(household, select(equivalised_income <= income_tenth_2, people * equivalised_income, 0.0)) / wsum(household, people * equivalised_income)"

[var.income_tenth_3]
type = "real"
unit = "GBP/month/household"
phase = "income"
expr = "quantile(household, equivalised_income, 0.3, people)"

[var.lorenz_3]
type = "real"
unit = "1"
phase = "income"
expr = "wsum(household, select(equivalised_income <= income_tenth_3, people * equivalised_income, 0.0)) / wsum(household, people * equivalised_income)"

[var.income_tenth_4]
type = "real"
unit = "GBP/month/household"
phase = "income"
expr = "quantile(household, equivalised_income, 0.4, people)"

[var.lorenz_4]
type = "real"
unit = "1"
phase = "income"
expr = "wsum(household, select(equivalised_income <= income_tenth_4, people * equivalised_income, 0.0)) / wsum(household, people * equivalised_income)"

[var.income_tenth_5]
type = "real"
unit = "GBP/month/household"
phase = "income"
expr = "quantile(household, equivalised_income, 0.5, people)"

[var.lorenz_5]
type = "real"
unit = "1"
phase = "income"
expr = "wsum(household, select(equivalised_income <= income_tenth_5, people * equivalised_income, 0.0)) / wsum(household, people * equivalised_income)"

[var.income_tenth_6]
type = "real"
unit = "GBP/month/household"
phase = "income"
expr = "quantile(household, equivalised_income, 0.6, people)"

[var.lorenz_6]
type = "real"
unit = "1"
phase = "income"
expr = "wsum(household, select(equivalised_income <= income_tenth_6, people * equivalised_income, 0.0)) / wsum(household, people * equivalised_income)"

[var.income_tenth_7]
