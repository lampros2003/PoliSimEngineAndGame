value = 0.0271

[var.research_development]
label = "Research and development"
doc = "Spending on research and development as a share of output: 2.71% in 2024. Business's part (about two thirds) follows business investment against its trend; grants add 1.4 times themselves (firms add their own; a judgement). Productivity follows it"
type = "real"
unit = "1"
phase = "accounts"
expr = "research_development_2024 * (1.0 / 3.0 + 2.0 / 3.0 * business_investment / (business_investment_2024 * trend_index)) + 1.4 * rd_grants_cost / gdp"

# ---- the trade balance

[var.trade_balance]
label = "Trade balance"
doc = "Exports less imports: -£21bn in 2024 (ONS, national accounts; the base month)"
type = "money"
unit = "GBP/month"
phase = "spending"
expr = "exports - imports"

# ---- what the groups read (beliefs.toml), worked out in the accounts phase, so that each is
# nil in the base month

[var.farm_income_change]
doc = "Farm incomes against 2024's at today's prices, less one"
type = "real"
unit = "1"
phase = "accounts"
expr = "farm_incomes / (farm_incomes_2024 * price_index) - 1.0"

[var.house_price_change]
doc = "House prices against 2024's at consumer prices, less one"
type = "real"
unit = "1"
phase = "accounts"
expr = "house_prices / (house_price_2024 * consumer_price_index) - 1.0"

[var.energy_bill_change]
doc = "Energy bills against 2024's at consumer prices, less one"
type = "real"
unit = "1"
phase = "accounts"
expr = "energy_bills / (energy_bills_2024 * consumer_price_index) - 1.0"
