# ---- congestion and air pollution

[param.congestion_2024]
doc = "Hours a UK driver lost to congestion in 2024: 62 (INRIX, 2024 Global Traffic Scorecard)"
type = "real"
unit = "1"
value = 62.0

[var.congestion_target]
type = "real"
unit = "1"
phase = "accounts"
expr = "congestion_2024 * select(real_gdp_at_start < 0.0, 1.0, pow(real_gdp / real_gdp_at_start, 1.5)) * (1.0 - 0.35 * min(0.02 * congestion_charge_pounds, 0.67)) * (1.0 - 0.03 * rail_ownership) * (1.0 + 0.02 * (bus_fare_cap / bus_fare_cap_2024 - 1.0)) * (1.0 - 0.1 * (spending_transport / spending_transport_2024 - 1.0))"

[param.spending_transport_2024]
type = "money"
unit = "GBP/month"
value = {{spending_transport_2024}}

[state.congestion]
label = "Congestion"
doc = "Hours a driver loses to congestion a year: 62 in 2024. Up with traffic (output to the power 1.5), down with congestion charging (a third of the trips it puts off are in the worst traffic), public rail, cheaper buses and more on roads and railways, over about six months (judgements)"
type = "real"
unit = "1"
phase = "accounts"
initial = 62.0
next = "congestion + (congestion_target - congestion) / 6.0"

[param.air_pollution_2024]
doc = "Fine particles (PM2.5), population-weighted annual mean, about 7.5 micrograms a cubic metre in 2024 (Defra: 7.9 in England in 2023, falling; the 2024 figure is a judgement, not opened)"
type = "real"
unit = "1"
value = 7.5

[var.air_pollution]
label = "Air pollution"
doc = "Fine particles in the air people breathe, micrograms a cubic metre: about 7.5 in 2024. Two fifths follow households' emissions, two fifths traffic congestion, a fifth neither (judgements). Healthy life falls 0.05 years for each microgram"
type = "real"
unit = "1"
phase = "accounts"
expr = "air_pollution_2024 * (0.2 + 0.4 * select(household_emissions_at_start < 0.0, 1.0, household_emissions / household_emissions_at_start) + 0.4 * congestion / congestion_2024)"

