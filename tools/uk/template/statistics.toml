doc = "Total income from farming, UK, 2024: £7.7bn (Defra, first estimate, June 2025)"
type = "money"
unit = "GBP/year"
value = 7700000000

[param.farm_emissions_priced]
doc = "The farm emissions whose carbon price falls on farm incomes: half of about 45 million tonnes a year (a judgement)"
