# ---- rents and house prices

[param.rents_2024]
doc = "Average private rent, Great Britain, December 2024: £1,327 a month (ONS, Price Index of Private Rents)"
type = "money"
unit = "GBP/month/household"
value = 1327

[var.rent_growth]
label = "Rent growth, annual rate"
doc = "Consumer inflation plus a point (rents' real rise of the 2010s, a judgement), less 0.3 of the change in homes built by the policies, plus half the change in net migration; capped at inflation by capped rises, at a point below it by strict controls"
type = "real"
unit = "1"
phase = "accounts"
expr = "select(rent_controls == 2, min(rent_growth_free, consumer_inflation_annual - 0.01), select(rent_controls == 1, min(rent_growth_free, consumer_inflation_annual), rent_growth_free))"

[var.rent_growth_free]
type = "real"
unit = "1"
phase = "accounts"
expr = "consumer_inflation_annual + 0.01 - 0.3 * (homes_policy_level - 1.0) + 0.5 * (policy_migration_factor - 1.0)"

[state.rents]
label = "Rents"
doc = "Average private rent a month: £1,327 in December 2024"
type = "real"
unit = "GBP/month/household"
phase = "accounts"
initial = 132700.0
next = "select(months_elapsed == 0, rents, rents * (1.0 + rent_growth / 12.0))"

[var.real_rents]
doc = "Rents against 2024's at consumer prices"
type = "real"
unit = "1"
phase = "accounts"
expr = "rents / rents_2024 / consumer_price_index"

[param.house_price_2024]
doc = "Average house price, UK, December 2024: £268,000 (ONS, UK House Price Index)"
type = "money"
unit = "GBP/home"
value = 268000

[var.house_price_target]
type = "real"
unit = "GBP/home"
phase = "accounts"
expr = "house_price_2024 * consumer_price_index * max(1.0 - 8.0 * (mortgage_rate - mortgage_rate_2024), 0.5) * (1.0 - 0.5 * (homes_policy_level - 1.0))"

[state.house_prices]
label = "House prices"
doc = "The average house price: £268,000 in December 2024. It follows prices, falls 8% for each point on the mortgage rate and as more homes are built, over about a year (judgements)"
type = "real"
unit = "GBP/home"
phase = "accounts"
initial = 26800000.0
next = "house_prices + (house_price_target - house_prices) / 12.0"

# ---- energy bills

[param.energy_bills_2024]
doc = "Ofgem's price cap for a typical household, January to March 2025: £1,738 a year"
type = "money"
unit = "GBP/year/household"
value = 1738

[var.energy_bills]
label = "Energy bills"
doc = "A typical household's energy bill a year: £1,738 under Ofgem's cap for January 2025. Up with prices and the carbon price households pay; down with insulation, onshore wind (£15 a year for each £1bn a year of support, a judgement) and help with bills"
type = "real"
unit = "GBP/year/household"
phase = "accounts"
expr = "energy_bills_2024 * consumer_price_index + (carbon_tax_households - energy_bills_saved) * year / (homes_2024 * household_per_home) - wind_built * wind_bill_saving - energy_bill_help"

[param.wind_bill_saving]
type = "money"
unit = "GBP/year/household"
value = 15

# ---- days lost to strikes

[param.strike_days_2024]
doc = "Working days lost to strikes in 2024: about 0.6 million (ONS, labour disputes; the monthly figures run from about 40,000 to about 110,000; the year's total is an estimate, not opened)"
type = "real"
unit = "1"
value = 600000.0

[var.strike_days_target]
type = "real"
unit = "1"
phase = "accounts"
expr = "strike_days_2024 * exp(-20.0 * (public_real_pay - 1.0)) * (1.0 + 0.4 * (1 - trade_union_law)) * (1.0 - 0.3 * strike_limits) * (1.0 + 0.1 * rail_ownership) * max(1.0 - 5.0 * select(unemployment_at_start < 0.0, 0.0, unemployment_rate - unemployment_at_start), 0.3)"

[state.strike_days]
label = "Days lost to strikes"
doc = "Working days lost to strikes a year: about 0.6 million in 2024. Many more when public pay falls behind prices (a 5% squeeze nearly triples them, as in 2022-23), with stronger unions and fewer with limits on strikes (judgements); over about six months"
type = "real"
unit = "1"
phase = "accounts"
initial = 600000.0
next = "strike_days + (strike_days_target - strike_days) / 6.0"

# ---- business confidence

[param.business_confidence_2024]
doc = "Lloyds Business Barometer, December 2024: 39%"
type = "real"
unit = "1"
value = 39.0

[var.business_confidence_target]
type = "real"
unit = "1"
phase = "accounts"
expr = "business_confidence_2024 - 100.0 * (corporation_tax_rate - 0.25) - 300.0 * select(borrowing_cost_at_start < -0.5 or borrowing_cost_smoothed < -0.5, 0.0, borrowing_cost_smoothed - borrowing_cost_at_start) + 200.0 * (output_growth - 0.015) - 20.0 * (trade_barrier_eu + trade_barrier_united_states + trade_barrier_china + trade_barrier_rest_of_world) - 3.0 * (strike_days / strike_days_2024 - 1.0)"

[state.business_confidence]
label = "Business confidence"
doc = "The Lloyds Business Barometer: 39% in December 2024. Down with corporation tax (a point for each point), dearer borrowing, trade barriers and strikes, up with growth, over about six months (judgements). Business investment follows it a little"
type = "real"
unit = "1"
phase = "accounts"
initial = 39.0
next = "select(months_elapsed == 0, business_confidence, business_confidence + (business_confidence_target - business_confidence) / 6.0)"

[var.confidence_factor]
doc = "Business investment, for confidence: 0.2% for each point of the barometer against 2024's (a judgement)"
type = "real"
unit = "1"
phase = "spending"
expr = "clamp(1.0 + 0.002 * (business_confidence - business_confidence_2024), 0.8, 1.2)"

