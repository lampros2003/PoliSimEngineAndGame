doc = "Total income from farming a year: £7.7bn in 2024. Up with farm support (80% of it reaches incomes); down with trade barriers (a tenth on all partners, 10%), the carbon price on half the farms' emissions and fuel duty (£20m a year a penny, a judgement)"
