[var.lorenz_7]
type = "real"
unit = "1"
phase = "income"
expr = "wsum(household, select(equivalised_income <= income_tenth_7, people * equivalised_income, 0.0)) / wsum(household, people * equivalised_income)"

[var.income_tenth_8]
type = "real"
unit = "GBP/month/household"
phase = "income"
expr = "quantile(household, equivalised_income, 0.8, people)"

[var.lorenz_8]
type = "real"
unit = "1"
