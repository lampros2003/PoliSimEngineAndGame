[var.gini_households]
label = "Gini coefficient of the households' incomes"
doc = "One less the area under the Lorenz curve, twice, by the trapezium rule at each tenth"
type = "real"
unit = "1"
phase = "income"
expr = "1.0 - 0.1 * (2.0 * (lorenz_1 + lorenz_2 + lorenz_3 + lorenz_4 + lorenz_5 + lorenz_6 + lorenz_7 + lorenz_8 + lorenz_9) + 1.0)"

[state.gini_at_start]
type = "real"
unit = "1"
phase = "accounts"
initial = -1.0
next = "select(gini_at_start < 0.0, gini_households, gini_at_start)"

[param.gini_2024]
doc = "The Gini coefficient of equivalised household income before housing costs, UK, FYE 2024: 35% (DWP, Households Below Average Income, FYE 1995 to FYE 2024; unchanged from FYE 2023)"
type = "real"
unit = "1"
value = 0.35

[var.inequality]
label = "Inequality"
doc = "The Gini coefficient of household income, 35% in 2023-24: the households' own, scaled to the published level, less the wealth tax's effect (the records hold no wealth: 0.3 points for each 1%, a judgement)"
type = "real"
unit = "1"
phase = "accounts"
expr = "select(gini_at_start < 0.0, gini_2024, gini_2024 * gini_households / gini_at_start) - 0.3 * net_wealth_tax"

