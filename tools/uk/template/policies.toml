# Real policies and the indicators they move (stage S13.5, docs/S13-PLAN.md). GENERATED:
# copied from tools/uk/template/policies.toml by tools/uk/calibrate.py. Edit the template.
#
# Nineteen policies in real units (a drinking age in years, fuel duty in pence a litre, an
# electric car grant in pounds a car) or levels (sentencing, planning rules, rent controls),
# and six indicators: crime, healthy life expectancy, school attainment, homes built, net
# migration and the electric share of new cars. Every figure, its source and every
# judgement are in models/uk/POLICIES.md.
#
# How a policy reaches the rest of the model, each through a single term that is zero, or a
# factor of one, with every policy at its 2024 setting, so the base month and the hindcast
# do not move:
#
#   money       policy_duties (taxes on production), policy_charges (other receipts),
#               policy_purchases (public purchases), policy_investment (public investment),
#               policy_subsidies (subsidies), policy_benefits (benefits): economy.toml
#   prices      policy_duties / consumption, on the tax wedge: prices.toml
#   emissions   household_emissions_factor, on households' emissions: emissions.toml
#   homes       homes_policy_level, on households' investment in homes: economy.toml
#   people      policy_migration_factor on net arrivals (population.toml) and
#               policy_labour_force_growth on the labour force (model.toml)
#   health      health_demand_factor, on referrals for treatment: nhs.toml
#   voters      policy_standing, on government_standing; crime_policy_level, on the
#               policing issue: politics.toml
#
# Real values in pounds are held in pence, as every money value is (docs/spec/01): fuel
# duty's 52.95 is pence a litre.

# ================================================================= law and order

[lever.drinking_age]
label = "Legal age to buy alcohol"
group = "Law and order"
type = "int"
unit = "1"
default = 18
range = [16, 21]
leaning = "right"
capital_weight = 0.5
doc = "The youngest age at which people may buy alcohol, in years: 18 in 2024. Raising it cuts drinking and alcohol-related crime among the young a little; the young resent it."

[lever.sentencing]
label = "Sentencing"
group = "Law and order"
type = "int"
unit = "1"
default = 2
range = [0, 4]
leaning = "right"
capital_weight = 0.8
doc = "How tough sentences are, from lenient (0) to tough (4); 2 is the 2024 practice. Each step up holds about 8% more prisoners within two years, at about £52,000 a year each, and keeps a little more crime off the streets."

[lever.cannabis_law]
label = "Cannabis law"
group = "Law and order"
type = "int"
unit = "1"
default = 0
range = [0, 2]
leaning = "left"
capital_weight = 1.0
doc = "Cannabis is illegal (0, as in 2024), decriminalised for personal use (1), or legal, sold under licence and taxed (2). Legal sale raises about £1bn a year and takes some trade from criminal markets; older voters dislike it."

[param.prison_population_2024]
doc = "Prisoners in England and Wales at 31 December 2024 (Ministry of Justice, Offender management statistics quarterly)"
type = "real"
unit = "person"
value = 85372.0

[param.sentencing_step]
doc = "How much each step of sentencing moves the prison population in time (a judgement: two steps tougher holds about 100,000, near the Ministry of Justice's central projection for 2029)"
type = "real"
unit = "1"
value = 0.08

[param.prison_adjust_months]
doc = "Months over which the prison population follows a change in sentencing (a judgement: sentences already passed run their course)"
type = "real"
unit = "1"
value = 24.0

[param.prison_cost_per_prisoner]
doc = "What a prison place costs a month: £51,724 a year, the overall average for 2022-23 (Ministry of Justice, Costs per place and costs per prisoner), in pence"
type = "real"
unit = "GBP/month/person"
value = 431033.3333333333

[state.prison_population]
label = "Prison population"
doc = "Prisoners in England and Wales, following sentencing over about two years"
type = "real"
unit = "person"
phase = "accounts"
initial = 85372.0
next = "prison_population + (prison_population_2024 * (1.0 + sentencing_step * (sentencing - 2)) - prison_population) / prison_adjust_months"

[param.cannabis_tax]
doc = "What legal, taxed cannabis would raise a month, in 2024 prices: about £1bn a year (a judgement in the range of published estimates)"
type = "money"
unit = "GBP/month"
value = 83333333.33

[var.prison_cost_change]
label = "Prisons: cost of sentencing"
doc = "Prisoners above or below December 2024's, at the average cost of a place"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round((prison_population - prison_population_2024) * prison_cost_per_prisoner * trend_index)"

[var.cannabis_tax_receipts]
label = "Cannabis tax"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round(select(cannabis_law == 2, 1.0, 0.0) * cannabis_tax * trend_index)"

# ---- crime

[param.crime_2024]
doc = "Crimes against households and adults in England and Wales a year, the Crime Survey's headline measure, in the year to June 2024 (ONS, Crime in England and Wales)"
type = "real"
unit = "incident/year"
value = 9200000.0

[param.police_crime_elasticity]
doc = "Crime falls this share for each unit rise in the police, courts and prisons service level (a judgement from studies of police numbers and crime, about -0.3)"
type = "real"
unit = "1"
value = 0.3

[param.prison_crime_elasticity]
doc = "Crime falls this share for each unit rise in the prison population against 2024's (a judgement: incapacitation, smaller than the American estimates at far higher imprisonment)"
type = "real"
unit = "1"
value = 0.15

[param.alcohol_crime_elasticity]
doc = "Crime rises this share for each unit rise in alcohol drunk (a judgement: alcohol is involved in about two fifths of violent incidents, a smaller share of all crime)"
type = "real"
unit = "1"
value = 0.1

[param.drinking_age_crime]
doc = "Crime falls this share for each year the drinking age rises above 18 (a judgement from studies of the American drinking age of 21)"
type = "real"
unit = "1"
value = 0.005

[param.crime_adjust_months]
doc = "Months over which crime follows the policies that move it (a judgement)"
type = "real"
unit = "1"
value = 12.0

[var.crime_policy_target]
doc = "Where the policies are taking crime, against 2024's: prisons, alcohol, the drinking age and cannabis law"
type = "real"
unit = "1"
phase = "accounts"
expr = "(1.0 - prison_crime_elasticity * (prison_population / prison_population_2024 - 1.0)) * (1.0 + alcohol_crime_elasticity * (alcohol_use - 1.0)) * (1.0 - drinking_age_crime * (drinking_age - 18)) * (1.0 - select(cannabis_law == 1, 0.005, select(cannabis_law == 2, 0.015, 0.0)))"

[state.crime_policy_level]
label = "Crime: the policies' effect"
doc = "Crime against what it would be with every policy as in 2024, following the policies over about a year; voters weigh it with the police service"
type = "real"
unit = "1"
phase = "accounts"
initial = 1.0
next = "crime_policy_level + (crime_policy_target - crime_policy_level) / crime_adjust_months"

[var.crime_incidents]
label = "Crime (incidents a year)"
doc = "Crimes against households and adults in England and Wales a year, as the Crime Survey counts them: 9.2 million in the year to June 2024. Fewer with more police, tougher sentences and less drinking"
type = "real"
unit = "incident/year"
phase = "accounts"
expr = "crime_2024 * (1.0 - police_crime_elasticity * (service_level[function: 3] - 1.0)) * crime_policy_level"

