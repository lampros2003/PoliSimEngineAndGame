# ---- public health

[param.hle_2024]
doc = "Healthy life expectancy at birth, UK, 2022-24: 60.7 years for men, 60.9 for women (ONS, Health state life expectancies)"
type = "real"
unit = "year"
value = 60.8

[param.hle_service_effect]
doc = "Years of healthy life per unit of the health service level (a judgement: a tenth more care per person needing it adds about a third of a year)"
type = "real"
unit = "year"
value = 3.0

[param.hle_smoking_effect]
doc = "Years of healthy life lost per unit of the share of adults who smoke (a judgement: a point less smoking adds about 0.15 years)"
type = "real"
unit = "year"
value = 15.0

[param.hle_alcohol_effect]
doc = "Years of healthy life lost per unit of alcohol harm against 2024 (a judgement: a tenth less harm adds about 0.06 years)"
type = "real"
unit = "year"
value = 0.6

[param.hle_year]
doc = "A year of healthy life: the unit of the judgements in hle_other (stage S13.6)"
type = "real"
unit = "year"
value = 1.0

[state.hle_other]
label = "Healthy life: other policies"
doc = "Years of healthy life from the soft drinks levy, prescription charges and cannabis law, following them over about three years (judgements: 0.02 years for each multiple of the levy; 0.03 lost when the charge doubles; 0.03 lost with legal cannabis)"
type = "real"
unit = "year"
phase = "accounts"
initial = 0.0
next = "hle_other + ((0.02 * (sugar_levy - 1.0) - 0.03 * (prescription_charge / prescription_charge_2024 - 1.0) - select(cannabis_law == 2, 0.03, 0.0)) * hle_year - hle_other) / 36.0"

[var.healthy_life_expectancy]
label = "Healthy life expectancy"
doc = "Years a newborn can expect to live in good health, UK: 60.8 in 2022-24. Longer with a better-funded health service, less smoking and less drinking"
type = "real"
unit = "year"
phase = "accounts"
expr = "hle_2024 + hle_service_effect * (service_level[function: 0] - 1.0) - hle_smoking_effect * (smoking_prevalence - smoking_2024) - hle_alcohol_effect * (alcohol_harm - 1.0) + hle_other"

[var.health_demand_factor]
doc = "Referrals for treatment against what they would be with 2024's smoking and drinking (judgements: smoking causes about 4% of hospital work and alcohol about 2%)"
type = "real"
unit = "1"
phase = "accounts"
expr = "1.0 + 0.04 * (smoking_prevalence / smoking_2024 - 1.0) + 0.02 * (alcohol_harm - 1.0)"

