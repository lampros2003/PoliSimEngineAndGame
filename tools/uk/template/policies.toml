expr = "2025.0 + months_elapsed / 12.0"

[var.ev_share_path]
label = "Electric share of new cars, on the path to the ban"
doc = "Rising from 2024's share in the first month to 80% in the year of the ban along the zero-emission vehicle mandate's path, then in a straight line to all new cars five years after"
type = "real"
unit = "1"
phase = "labour"
expr = "select(ev_year < 1.0 * petrol_ban_year, curve((ev_year - 2025.0) / (petrol_ban_year - 2025.0), ev_path_shape), min(ev_share_at_ban + (1.0 - ev_share_at_ban) * (ev_year - petrol_ban_year) / 5.0, 1.0))"

[var.ev_share_path_2024]
doc = "The same path with the ban in its year at the start"
type = "real"
unit = "1"
phase = "labour"
expr = "select(ev_year < 1.0 * petrol_ban_2024, curve((ev_year - 2025.0) / (petrol_ban_2024 - 2025.0), ev_path_shape), min(ev_share_at_ban + (1.0 - ev_share_at_ban) * (ev_year - petrol_ban_2024) / 5.0, 1.0))"

[state.ev_policy_extra]
doc = "Points of electric share of new cars from the grant and fuel duty, following them over about six months"
type = "real"
unit = "1"
phase = "accounts"
initial = 0.0
next = "ev_policy_extra + (curve(ev_grant / ev_grant_reference, ev_grant_effect) + fuel_ev_response * (fuel_duty - fuel_duty_2024) - ev_policy_extra) / 6.0"

[var.ev_share]
label = "Electric share of new cars"
doc = "Battery-electric cars among new cars: 19.1% in 2024. Rises toward the ban on petrol and diesel cars, faster with a grant or dearer fuel"
type = "real"
unit = "1"
phase = "labour"
expr = "clamp(ev_share_path + ev_policy_extra, 0.0, 1.0)"

[var.ev_share_extra]
doc = "The electric share of new cars above what it would be with every policy as at the start"
type = "real"
unit = "1"
phase = "labour"
expr = "ev_share - clamp(ev_share_path_2024, 0.0, 1.0)"

[state.ev_fleet_extra]
label = "Electric cars on the road from the policies"
doc = "The share of the cars on the road that are electric because of the policies: each month's extra electric share of new cars, times new cars over all cars"
type = "real"
unit = "1"
phase = "accounts"
initial = 0.0
next = "clamp(ev_fleet_extra + ev_share_extra * new_car_share_of_fleet, -1.0, 1.0)"

[var.ev_grant_cost]
label = "Electric car grant"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round(ev_grant * new_cars_month * ev_share)"

# ---- buses

[param.bus_fare_cap_2024]
doc = "The single bus fare cap in England outside London in 2024"
type = "money"
unit = "GBP/journey"
value = 2.00

[param.bus_fare_uncapped]
doc = "The average single fare the cap replaced (a judgement, about £2.80)"
type = "money"
unit = "GBP/journey"
value = 2.80

[param.bus_capped_journeys]
doc = "Journeys a month whose fare the cap lowers, so that the £2 cap costs about £0.3bn a year (an estimate: the cost was not found published)"
type = "real"
unit = "journey/month"
value = 31250000.0

[var.bus_fare_cost_change]
label = "Bus fare cap: cost against 2024"
doc = "Support to bus companies for fares the cap holds below the uncapped fare, against the £2 cap"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round(bus_capped_journeys * (max(bus_fare_uncapped - bus_fare_cap, 0) - (bus_fare_uncapped - bus_fare_cap_2024)))"

# ================================================================= environment and energy

[lever.insulation_programme]
label = "Home insulation programme"
group = "Environment and energy"
type = "money"
unit = "GBP/month"
default = 0
range = [0, 400000000]
leaning = "left"
capital_weight = 0.5
doc = "Public money to insulate homes, beyond the schemes of 2024, in 2024 prices: none at the start. About £5,000 treats a home, cutting its heating, its bills and its emissions for good."

[param.insulation_cost_per_home]
doc = "Public money to insulate a home (a judgement across loft, cavity and solid wall insulation)"
type = "money"
unit = "GBP/home"
value = 5000

[param.homes_2024]
doc = "Households in the UK, about 28.4 million (an estimate from ONS's Families and households)"
type = "real"
unit = "home"
value = 28400000.0

[param.insulation_saving]
doc = "The share of a home's heating that insulation saves (a judgement)"
type = "real"
unit = "1"
value = 0.15

[param.household_heating_share]
doc = "Heating's share of households' own emissions (a judgement; the rest is mostly driving)"
type = "real"
unit = "1"
value = 0.55

[param.household_car_share]
doc = "Driving's share of households' own emissions (a judgement)"
type = "real"
unit = "1"
value = 0.45

[param.insulation_bill_saving]
doc = "What an insulated home saves on its energy bills a month (a judgement, about £180 a year)"
type = "money"
unit = "GBP/month/home"
value = 15

[state.homes_insulated]
label = "Homes insulated by the programme"
type = "real"
unit = "home"
phase = "accounts"
initial = 0.0
next = "homes_insulated + times_step(insulation_programme / insulation_cost_per_home)"

[var.insulation_cost]
label = "Home insulation programme"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round(insulation_programme * trend_index)"

[var.energy_bills_saved]
label = "Energy bills saved by insulation"
type = "money"
unit = "GBP/month"
phase = "accounts"
expr = "round(homes_insulated * insulation_bill_saving * trend_index)"

[var.household_emissions_factor]
doc = "Households' emissions against what they would be with every policy as in 2024: less driving, more electric cars and insulated homes"
type = "real"
unit = "1"
phase = "accounts"
expr = "1.0 - household_car_share * (1.0 - fuel_volume * (1.0 - ev_fleet_extra)) - household_heating_share * insulation_saving * min(homes_insulated / homes_2024, 1.0)"

# ================================================================= education

[lever.tuition_fee_cap]
label = "University tuition fee cap"
group = "Education"
type = "money"
unit = "GBP/student"
default = 9250
range = [0, 15000]
leaning = "right"
capital_weight = 1.0
doc = "The most English universities may charge a home student a year: £9,250 in 2024, paid with student loans. A higher cap gives universities more, at a public cost for the loans never repaid, and puts some students off; the young dislike it."

[lever.free_school_meals]
label = "Free school meals"
group = "Education"
type = "int"
unit = "1"
default = 0
range = [0, 2]
leaning = "left"
capital_weight = 0.5
doc = "Who gets free school meals in England: the poorest families (0, as in 2024, about a quarter of pupils), all families on Universal Credit (1), or all pupils (2). Wider meals cost more and lift attainment a little; parents welcome them."

[param.tuition_fee_2024]
doc = "The tuition fee cap in England for 2024-25"
type = "money"
unit = "GBP/student"
value = 9250

[param.fee_paying_students]
doc = "Students paying the full fee, about 1.08 million (an estimate: about £10bn of fee income over £9,250)"
type = "real"
unit = "student"
value = 1080000.0

[param.tuition_unrepaid_share]
doc = "The share of fee loans never repaid, a public cost (a judgement, about three tenths)"
type = "real"
unit = "1"
value = 0.3

[param.tuition_fee_step]
doc = "£1,000 a year: the step at which reactions to fees are stated"
type = "money"
unit = "GBP/student"
value = 1000

[var.fee_paying_students_now]
label = "Students paying fees"
doc = "A tenth fewer for each doubling of the fee (a judgement: the tripling of 2012 did little to numbers)"
type = "real"
unit = "student"
phase = "labour"
expr = "fee_paying_students * max(1.0 - 0.1 * (tuition_fee_cap / tuition_fee_2024 - 1.0), 0.5)"

[var.tuition_cost_change]
label = "Tuition fees: public cost against 2024"
doc = "The share of fee loans never repaid, on fees above or below 2024's"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round(per_step(tuition_fee_cap * fee_paying_students_now - tuition_fee_2024 * fee_paying_students) * tuition_unrepaid_share / 12.0)"

[param.school_meal_cost]
doc = "Free meals for a pupil a month: £2.61 a meal over 190 school days, about £496 a year (the 2024-25 rate), in pence"
type = "real"
unit = "GBP/month/pupil"
value = 4133.333333333333

[param.meals_pupils_universal_credit]
doc = "Pupils who would gain free meals if all families on Universal Credit had them (an estimate, about half a million)"
type = "real"
unit = "pupil"
value = 500000.0

[param.meals_pupils_all]
doc = "Pupils in England without free meals in 2024: about 9 million less 2.1 million eligible and 1.3 million infants already fed (an estimate)"
type = "real"
unit = "pupil"
value = 5500000.0

[var.school_meals_cost]
label = "Free school meals: cost of wider meals"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round(select(free_school_meals == 1, meals_pupils_universal_credit, select(free_school_meals == 2, meals_pupils_all, 0.0)) * school_meal_cost * trend_index)"

[param.attainment_2024]
doc = "Pupils in England reaching grade 5 or above in English and maths GCSE, 2023-24 (DfE, Key stage 4 performance)"
type = "real"
unit = "1"
value = 0.459

[param.attainment_service_effect]
doc = "Points of attainment per unit of the education service level (a judgement: a tenth more spending per pupil adds about 1.5 points over some years)"
type = "real"
unit = "1"
value = 0.15

[state.school_attainment]
label = "School attainment"
doc = "Pupils in England reaching grade 5 in English and maths GCSE: 45.9% in 2023-24. It follows spending per pupil and free school meals over about two years (meals for all families on Universal Credit add 0.2 points, for all pupils 0.8: judgements)"
type = "real"
unit = "1"
phase = "accounts"
initial = 0.459
next = "school_attainment + (attainment_2024 + attainment_service_effect * (service_level[function: 1] - 1.0) + select(free_school_meals == 1, 0.002, select(free_school_meals == 2, 0.008, 0.0)) - school_attainment) / 24.0"

# ================================================================= housing

[lever.planning_rules]
label = "Planning rules"
group = "Housing"
type = "int"
unit = "1"
default = 2
range = [0, 4]
leaning = "right"
capital_weight = 1.0
doc = "How readily new homes get permission, from very restrictive (0) to very liberal (4); 2 is the 2024 rules. Each step toward liberal builds about 7.5% more homes within two years and more construction; home owners resist it, renters welcome it."

[lever.social_housing]
label = "Social housing programme"
group = "Housing"
type = "money"
unit = "GBP/month"
default = 0
range = [0, 500000000]
leaning = "left"
capital_weight = 0.6
doc = "Public money for new social homes, beyond the programmes of 2024, in 2024 prices: none at the start. About £150,000 builds a home, finished about two years on."

[lever.rent_controls]
label = "Rent controls"
group = "Housing"
type = "int"
unit = "1"
default = 0
range = [0, 2]
leaning = "left"
capital_weight = 1.0
doc = "Limits on private rents: none (0, England in 2024), rises capped each year (1), or strict limits (2). Renters welcome them; landlords build and let fewer homes."

[param.homes_built_2024]
doc = "Net additional dwellings in England, 2023-24 (Ministry of Housing, Housing supply: net additional dwellings)"
type = "real"
unit = "home/year"
value = 221070.0

[param.planning_step]
doc = "Homes built for each step of planning rules (a judgement from the OBR's estimate that the 2024 reforms add about 170,000 homes over five years, some 15%)"
type = "real"
unit = "1"
value = 0.075

[param.social_home_cost]
doc = "Public money for a new social home (a judgement)"
type = "money"
unit = "GBP/home"
value = 150000

[state.homes_policy_level]
label = "Homes built: the policies' effect"
doc = "Private homes built against what they would be with 2024's rules, following planning rules and rent controls over about two years (rent controls: 2% fewer when capped, 6% when strict, judgements); households' investment in homes follows it"
type = "real"
unit = "1"
phase = "accounts"
initial = 1.0
next = "homes_policy_level + ((1.0 + planning_step * (planning_rules - 2)) * (1.0 - select(rent_controls == 1, 0.02, select(rent_controls == 2, 0.06, 0.0))) - homes_policy_level) / 24.0"

[state.social_homes_rate]
label = "Social homes built a year by the programme"
type = "real"
unit = "home/year"
phase = "accounts"
initial = 0.0
next = "social_homes_rate + (year * (social_housing / social_home_cost) - social_homes_rate) / 24.0"

[var.homes_built]
label = "Homes built (a year)"
doc = "Net additional homes in England a year: 221,070 in 2023-24. More with liberal planning and a social housing programme, fewer with rent controls"
type = "real"
unit = "home/year"
phase = "accounts"
expr = "homes_built_2024 * homes_policy_level + social_homes_rate"

[var.social_housing_cost]
label = "Social housing programme"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round(social_housing * trend_index)"

# ================================================================= welfare

[lever.winter_fuel_payment]
label = "Winter Fuel Payment"
group = "Welfare"
type = "int"
unit = "1"
default = 1
range = [0, 2]
leaning = "left"
capital_weight = 1.0
doc = "A payment of £200 or £300 to pensioners each winter: none (0), only to those on Pension Credit (1, from the winter of 2024), or to every pensioner (2), which costs about £1.4bn a year more. Pensioners care about it a great deal."

[param.winter_fuel_universal]
doc = "What paying every pensioner costs more than the means test, a month: about £1.4bn a year (as reported when the means test was brought in)"
type = "money"
unit = "GBP/month"
value = 116666666.67

[param.winter_fuel_means_tested]
doc = "What the means-tested payment costs a month: about 1.5 million pensioners, about £0.4bn a year (an estimate)"
type = "money"
unit = "GBP/month"
value = 33333333.33

[var.winter_fuel_change]
label = "Winter Fuel Payment: cost against 2024"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round(select(winter_fuel_payment == 2, winter_fuel_universal, select(winter_fuel_payment == 0, 0 - winter_fuel_means_tested, 0)) * trend_index)"

# ================================================================= foreign and trade

[lever.visa_threshold]
label = "Skilled worker visa salary threshold"
group = "Foreign and trade"
type = "money"
unit = "GBP/worker"
default = 38700
range = [20000, 60000]
leaning = "right"
capital_weight = 0.8
doc = "The least a job must pay for a skilled worker visa: £38,700 from April 2024 (up from £26,200). A higher threshold cuts net migration and the labour force; older voters welcome it, business does not."

[param.visa_threshold_2024]
doc = "The skilled worker salary threshold from 4 April 2024"
type = "money"
unit = "GBP/worker"
value = 38700

[param.visa_reaction_step]
doc = "£10,000: the step at which reactions to the threshold are stated"
type = "money"
unit = "GBP/worker"
value = 10000

[table.visa_migration]
kind = "curve"
x_unit = "1"
unit = "1"
# Net migration a year, in thousands, against the threshold over 2024's (a judgement: the Home
# Office reckoned the 2024 rise would stop about 300,000 visas a year, with dependants, and
# about a third of that shows in net migration; the effect tails off far from today's).
points = [{ x = 0.517, y = 100.0 }, { x = 1.0, y = 0.0 }, { x = 1.55, y = -110.0 }]

[param.visa_migration_scale]
doc = "A thousand people a year: the curve's unit"
type = "real"
unit = "person/year"
value = 1000.0

[param.migrant_labour_share]
doc = "The share of net migrants who join the labour force (a judgement)"
type = "real"
unit = "1"
value = 0.6

[state.migration_change]
label = "Net migration from the policies (a year)"
doc = "Net migration a year above or below what the population model has, following the visa threshold over about a year"
type = "real"
unit = "person/year"
phase = "accounts"
initial = 0.0
next = "migration_change + (visa_migration_scale * curve(visa_threshold / visa_threshold_2024, visa_migration) - migration_change) / 12.0"

[var.policy_migration_factor]
doc = "Net arrivals against the population model's own, the rate of the year to mid-2024"
type = "real"
unit = "1"
phase = "accounts"
expr = "1.0 + migration_change / (year * per_step(sum(net_migration, region)))"

[var.net_migration_annual]
label = "Net migration (a year)"
doc = "Net arrivals in the UK a year: 739,000 in the year to June 2024 (ONS), as the population model has them. A higher visa salary threshold cuts it"
type = "real"
unit = "person/year"
phase = "accounts"
expr = "year * per_step(sum(net_migration, region)) * policy_migration_factor"

[var.policy_labour_force_growth]
doc = "This month's growth in the labour force from the policies' net migration"
type = "real"
unit = "1"
phase = "accounts"
expr = "times_step(migrant_labour_share * migration_change / year) / labour_force"

# ================================================================= the money, in the accounts

[var.policy_duties]
label = "Duties and levies: change from 2024 rates"
doc = "Fuel, alcohol and tobacco duty, the soft drinks levy and a cannabis tax against 2024's; paid with the taxes on production, and passed on to shop prices"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "fuel_duty_change + alcohol_duty_change + tobacco_duty_change + sugar_levy_change + cannabis_tax_receipts"

[var.policy_charges]
label = "Charges: change from 2024"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "prescription_charge_change"

[var.policy_purchases]
label = "Policies' purchases"
doc = "Prisons, the public cost of tuition fees and free school meals, against 2024's"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "prison_cost_change + tuition_cost_change + school_meals_cost"

[var.policy_investment]
label = "Policies' investment"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "insulation_cost + social_housing_cost"

[var.policy_subsidies]
label = "Policies' subsidies"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "ev_grant_cost + bus_fare_cost_change"

[var.policy_benefits]
label = "Policies' benefits"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "winter_fuel_change"

# ================================================================= reactions

[param.billion_a_year]
doc = "£1bn a year, a month: the step at which reactions to spending are stated"
type = "money"
unit = "GBP/month"
value = 83333333.33

# What each kind of voter thinks of a policy for itself, apart from what it does: utility for
# the governing blocs, by voter type, through the groups' membership (politics.toml). All are
# judgements, sized so that a policy at an end of its range moves its groups' approval by a
# point or two and the national rating by tenths of a point (models/uk/POLICIES.md). A
# standing of -0.02 weighs on a voter type as much as about a third of a point more
# unemployment in its region.

[var.standing_drinking_age]
doc = "The young: -0.02 for each year above 18, +0.005 below; drinkers -0.01 above; pensioners +0.005 above, -0.01 below"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "group_member[group: young] * (0.005 * max(18 - drinking_age, 0) - 0.02 * max(drinking_age - 18, 0)) - group_member[group: drinkers] * 0.01 * max(drinking_age - 18, 0) + group_member[group: pensioner] * (0.005 * max(drinking_age - 18, 0) - 0.01 * max(18 - drinking_age, 0))"

[var.standing_sentencing]
doc = "Pensioners +0.01 for each step tougher, the young -0.01"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "(group_member[group: pensioner] - group_member[group: young]) * 0.01 * (sentencing - 2)"

[var.standing_cannabis]
doc = "For each step toward legal sale: the young +0.015, pensioners -0.02, parents -0.005"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "(0.015 * group_member[group: young] - 0.02 * group_member[group: pensioner] - 0.005 * group_member[group: parents]) * cannabis_law"

[var.standing_alcohol_duty]
doc = "Drinkers -0.04 for each multiple of the 2024 duty above it, +0.04 below"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "0.0 - 0.04 * group_member[group: drinkers] * (alcohol_duty - 1.0)"

[var.standing_tobacco_duty]
doc = "Smokers -0.06 for each multiple of the 2024 duty above it, +0.06 below"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "0.0 - 0.06 * group_member[group: smokers] * (tobacco_duty - 1.0)"

[var.standing_sugar_levy]
doc = "Low incomes and parents -0.005 each for each multiple of the 2024 levy above it"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "0.0 - 0.005 * (group_member[group: low_income] + group_member[group: parents]) * (sugar_levy - 1.0)"

[var.standing_prescription_charge]
doc = "Mid-life and low incomes -0.02 each for a doubling of the charge (most pensioners and children are exempt)"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "0.0 - 0.02 * (group_member[group: midlife] + group_member[group: low_income]) * (prescription_charge / prescription_charge_2024 - 1.0)"

[var.standing_fuel_duty]
doc = "Motorists -0.004 for each penny above 52.95, +0.002 for each penny below (a rise is resented more than a cut is thanked); the young +0.0005 a penny"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "group_member[group: motorists] * (0.002 * max(fuel_duty_2024 - fuel_duty, 0.0) - 0.004 * max(fuel_duty - fuel_duty_2024, 0.0)) / fuel_duty_penny + group_member[group: young] * 0.0005 * (fuel_duty - fuel_duty_2024) / fuel_duty_penny"

[var.standing_ev_grant]
doc = "For each £1,000 a car: the young +0.005, motorists +0.002"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "(0.005 * group_member[group: young] + 0.002 * group_member[group: motorists]) * 3.0 * (ev_grant / ev_grant_reference)"

[var.standing_bus_fare_cap]
doc = "Low incomes and the young -0.01 each for each pound above £2, +0.01 below"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "0.0 - 0.01 * (group_member[group: low_income] + group_member[group: young]) * (bus_fare_cap / bus_fare_cap_2024 - 1.0) * 2.0"

[var.standing_insulation]
doc = "For each £1bn a year: low incomes +0.008, the young +0.005"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "(0.008 * group_member[group: low_income] + 0.005 * group_member[group: young]) * insulation_programme / billion_a_year"

[var.standing_petrol_ban]
doc = "For each year earlier than 2030: motorists -0.01, the young +0.012 (most of the young are motorists too, so on balance they gain); for each year later: motorists +0.004, the young -0.012"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "group_member[group: motorists] * (0.004 * max(petrol_ban_year - petrol_ban_2024, 0) - 0.01 * max(petrol_ban_2024 - petrol_ban_year, 0)) + group_member[group: young] * (0.012 * max(petrol_ban_2024 - petrol_ban_year, 0) - 0.012 * max(petrol_ban_year - petrol_ban_2024, 0))"

[var.standing_tuition]
doc = "For each £1,000 above £9,250: the young -0.01, parents -0.003; for each £1,000 below: the young +0.005"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "(group_member[group: young] * (0.005 * max(tuition_fee_2024 - tuition_fee_cap, 0) - 0.01 * max(tuition_fee_cap - tuition_fee_2024, 0)) - group_member[group: parents] * 0.003 * max(tuition_fee_cap - tuition_fee_2024, 0)) / tuition_fee_step"

[var.standing_school_meals]
doc = "For each step wider: parents +0.01, lone parents +0.02 more, high incomes -0.003"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "(0.01 * group_member[group: parents] + 0.02 * group_member[group: lone_parents] - 0.003 * group_member[group: high_income]) * free_school_meals"

[var.standing_planning]
doc = "For each step toward liberal: home owners -0.01, renters +0.008, the young +0.005; toward restrictive: home owners +0.005, renters -0.008, the young -0.005"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "group_member[group: home_owners] * (0.005 * max(2 - planning_rules, 0) - 0.01 * max(planning_rules - 2, 0)) + (0.008 * group_member[group: renters] + 0.005 * group_member[group: young]) * (planning_rules - 2)"

[var.standing_social_housing]
doc = "For each £1bn a year: renters +0.01, low incomes +0.005"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "(0.01 * group_member[group: renters] + 0.005 * group_member[group: low_income]) * social_housing / billion_a_year"

[var.standing_rent_controls]
doc = "For each step tighter: renters +0.03, home owners -0.01, the self-employed -0.005"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "(0.03 * group_member[group: renters] - 0.01 * group_member[group: home_owners] - 0.005 * group_member[group: self_employed]) * rent_controls"

[var.standing_winter_fuel]
doc = "Pensioners +0.04 for paying every pensioner, -0.04 for paying none, against the means test"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "0.04 * group_member[group: pensioner] * (winter_fuel_payment - 1)"

[var.standing_visa_threshold]
doc = "For each £10,000 above £38,700: pensioners +0.01, the young -0.01, the self-employed -0.005"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "(0.01 * group_member[group: pensioner] - 0.01 * group_member[group: young] - 0.005 * group_member[group: self_employed]) * (visa_threshold - visa_threshold_2024) / visa_reaction_step"

[var.policy_standing]
label = "Policies, on the government's standing"
doc = "What voters of each type think of the government's policies for themselves, apart from what they do: added to government_standing"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "standing_drinking_age + standing_sentencing + standing_cannabis + standing_alcohol_duty + standing_tobacco_duty + standing_sugar_levy + standing_prescription_charge + standing_fuel_duty + standing_ev_grant + standing_bus_fare_cap + standing_insulation + standing_petrol_ban + standing_tuition + standing_school_meals + standing_planning + standing_social_housing + standing_rent_controls + standing_winter_fuel + standing_visa_threshold"
