# ---- alcohol

[param.alcohol_duty_2024]
doc = "Alcohol duty receipts in 2023-24, a month: £12.6bn a year (HMRC, Alcohol Bulletin)"
type = "money"
unit = "GBP/month"
value = 1050000000

[param.alcohol_duty_price_share]
doc = "The share of the price of a drink that is duty, so how much prices rise when duty doubles (a judgement, about a quarter across on- and off-trade drinks)"
type = "real"
unit = "1"
value = 0.25

[param.alcohol_price_elasticity]
doc = "Alcohol drunk against its price (a judgement of the average of HMRC's estimates, from -0.08 for wine bought in shops to -1.25 for spirits in pubs; HMRC Working Paper 16)"
type = "real"
unit = "1"
value = -0.5

[param.drinking_age_alcohol]
doc = "The share by which alcohol drunk falls for each year the drinking age rises above 18 (a judgement: people under 21 drink about a twentieth of it, and a ban cuts theirs by a quarter or so)"
type = "real"
unit = "1"
value = 0.003

[param.alcohol_harm_elasticity]
doc = "Alcohol deaths against alcohol drunk (a judgement: minimum unit pricing in Scotland cut sales 3% and deaths an estimated 13%, but it bore on the heaviest drinkers; a duty is spread wider)"
type = "real"
unit = "1"
value = 2.0

[param.alcohol_deaths_2024]
doc = "Alcohol-specific deaths registered in the UK in 2023 (ONS, Alcohol-specific deaths in the UK)"
type = "real"
unit = "death/year"
value = 10473.0

[var.alcohol_use_target]
doc = "Alcohol drunk against 2024, once prices and the drinking age have taken effect"
type = "real"
unit = "1"
phase = "accounts"
expr = "max(1.0 + alcohol_price_elasticity * alcohol_duty_price_share * (alcohol_duty - 1.0), 0.2) * (1.0 - drinking_age_alcohol * (drinking_age - 18))"

[state.alcohol_use]
label = "Alcohol drunk, against 2024"
type = "real"
unit = "1"
phase = "accounts"
initial = 1.0
next = "alcohol_use + (alcohol_use_target - alcohol_use) / 3.0"

[state.alcohol_harm]
label = "Alcohol harm, against 2024"
doc = "Alcohol deaths and illness against 2024's, following alcohol drunk over about two years"
type = "real"
unit = "1"
phase = "accounts"
initial = 1.0
next = "alcohol_harm + (1.0 + alcohol_harm_elasticity * (alcohol_use - 1.0) - alcohol_harm) / 24.0"

[var.alcohol_deaths]
label = "Alcohol-specific deaths (a year)"
doc = "Deaths wholly caused by alcohol in the UK a year: 10,473 in 2023"
type = "real"
unit = "death/year"
phase = "accounts"
expr = "alcohol_deaths_2024 * alcohol_harm"

[var.alcohol_duty_change]
label = "Alcohol duty: change from 2024 rates"
type = "money"
unit = "GBP/month"
phase = "labour"
expr = "round(alcohol_duty_2024 * trend_index * (alcohol_duty * alcohol_use - 1.0))"

