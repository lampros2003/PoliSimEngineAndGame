page = "https://www.ons.gov.uk/economy/grossdomesticproductgdp/datasets/quarterlynationalaccounts"
licence = "Open Government Licence v3.0"
attribution = "Source: Office for National Statistics licensed under the Open Government Licence v3.0"
format = "ons_timeseries"

