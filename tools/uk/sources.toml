# Where the United Kingdom's data come from. Every dataset is downloaded whole into
# .cache/uk/ by `python tools/uk/pipeline.py fetch`; only the series listed in
# series.toml are extracted into models/uk/data/.

[dataset.ukea]
title = "UK Economic Accounts"
publisher = "Office for National Statistics"
url = "https://www.ons.gov.uk/file?uri=/economy/grossdomesticproductgdp/datasets/unitedkingdomeconomicaccounts/current/ukea.csv"
page = "https://www.ons.gov.uk/economy/grossdomesticproductgdp/datasets/unitedkingdomeconomicaccounts"
licence = "Open Government Licence v3.0"
attribution = "Source: Office for National Statistics licensed under the Open Government Licence v3.0"
format = "ons_timeseries"

