publisher = "UK Parliament (House of Commons Library), Election Results"
url = "https://electionresults.parliament.uk/general-elections/6/candidacies.csv"
page = "https://electionresults.parliament.uk/general-elections/6"
licence = "Open Parliament Licence v3.0"
attribution = "Contains Parliamentary information licensed under the Open Parliament Licence v3.0"
format = "table"
file = "ge2024.csv"
note = "Votes by party and constituency only; candidates' names are not kept"

[dataset.ge2024parties]
