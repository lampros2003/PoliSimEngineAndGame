name: CI

on:
  push:
  pull_request:

jobs:
  oracle:
    # The recorded state hashes must be reproduced on every platform and Python version.
    name: Oracle tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        working-directory: oracle
        run: python -m unittest discover -s tests

  bench-self-check:
    # Builds the benchmark and runs its checks: the three rule-set variants must agree
    # with each other, and the random generator must agree with the oracle.
    name: Benchmark self-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run
        run: cargo run --release --manifest-path bench/s0/Cargo.toml
