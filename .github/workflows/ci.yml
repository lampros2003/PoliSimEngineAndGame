name: CI

on:
  push:
  pull_request:

jobs:
  oracle:
    # The recorded state hashes must be reproduced on every platform and Python version.
    name: Oracle tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        working-directory: oracle
        run: python -m unittest discover -s tests
      - name: The UK hindcast reproduces its committed results
        # Its inputs use the platform's exp and log, so it is checked on one platform.
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: python tools/uk/hindcast.py --check

  engine:
    # The engine must match the oracle: recorded hashes, the conformance corpus, save and
    # resume, and random scenarios run through both and compared byte for byte.
    name: Engine against the oracle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Tests
        run: cargo test --release --workspace
      - name: Build the runner
        run: cargo build --release
      - name: Random scenarios through oracle and engine
        run: python tools/diff_engine.py --count 150
      - name: Random UK scenarios through oracle and engine
        # With 20,000 households the oracle takes about a second a month: short scenarios.
        run: python tools/diff_engine.py --model models/uk --count 10 --max-steps 4
      - name: Random format 1 (cohort) scenarios through oracle and engine
        run: python tools/diff_engine.py --model models/cohort --count 40

  client:
    # The game client: build the engine library, let Godot register it, play 60 scripted
    # months through the bridge and compare every state hash with the runner. On Windows,
    # also assemble the downloadable test build.
    name: Client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: .godot-bin
          key: godot-4.7.2-${{ runner.os }}
      - name: Get Godot
        id: godot
        shell: bash
        run: echo "exe=$(python tools/get_godot.py --to .godot-bin | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Build the engine library and runner
        run: cargo build --release -p polisim-godot -p polisim-cli
      - name: Register the library with Godot
        run: python tools/build_client.py --godot "${{ steps.godot.outputs.exe }}"
      - name: Scripted client run against the runner
        run: python tools/check_client.py --godot "${{ steps.godot.outputs.exe }}"
      - name: Build the benchmark
        if: runner.os == 'Windows'
        run: cargo build --release --manifest-path bench/s0/Cargo.toml
      - name: Assemble the Windows test build
        if: runner.os == 'Windows'
        run: python tools/package_windows.py --godot-dir .godot-bin --out dist/PoliSim
      - name: Upload the Windows test build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: PoliSim-windows
          path: dist/
          retention-days: 30

  bench-self-check:
    # Builds the S0 benchmark and runs its checks: the three rule-set variants must agree
    # with each other, and the random generator must agree with the oracle.
    name: Benchmark self-check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and run
        run: cargo run --release --manifest-path bench/s0/Cargo.toml
