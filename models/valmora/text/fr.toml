# Valmora in French: a test translation (stage S7.4). The model's words are in its own
# files; these replace them when the game is played in French. `polisim text
# models/valmora/scenarios/term.toml fr` lists anything left untranslated.

[text]
language = "fr"
name = "Français"

[play]
currency_name = "couronnes"

[scenario.term]
title = "Valmora (un pays d'essai)"
summary = "Un petit pays imaginaire de huit millions de ménages, où le jeu a d'abord été construit : une économie et un budget, sans parlement ni élections."

[sector.households]
label = "Ménages"

[sector.firms]
label = "Entreprises"

[sector.government]
label = "État"

[element.wage]
label = "Salaire en emploi"
doc = "Salaire mensuel brut quand le ménage travaille"

[element.equity_units]
label = "Actions détenues"
doc = "Actions des entreprises détenues par chaque ménage"

[element.propensity_income]
label = "Part du revenu dépensée"
doc = "Part du revenu disponible du mois que les ménages dépensent"

[element.propensity_wealth]
label = "Part de l'épargne dépensée chaque mois"
doc = "Part de leur argent que les ménages dépensent chaque mois"

[element.wage_share]
label = "Masse salariale en part des ventes"
doc = "Masse salariale visée par les entreprises, en part des ventes hors TVA du mois précédent"

[element.labour_adjust]
label = "Vitesse des embauches et des licenciements"
doc = "Part de l'écart à la masse salariale voulue que les entreprises comblent chaque mois"

[element.separation_rate]
label = "Taux mensuel de perte d'emploi"
doc = "Probabilité mensuelle qu'un ménage en emploi perde son travail pour d'autres raisons"

[element.payout_rate]
label = "Part de la trésorerie distribuée"
doc = "Part de leur argent que les entreprises versent chaque mois aux actionnaires"

[element.higher_threshold]
label = "Seuil du taux supérieur"
doc = "Revenu mensuel au-dessus duquel s'applique le taux supérieur"

[element.gov_purchases]
label = "Achats de l'État"
doc = "Achats de l'État aux entreprises"

[element.benefit_rate]
label = "Allocation chômage"
doc = "Allocation versée à chaque ménage sans emploi"

[element.personal_allowance]
label = "Abattement personnel"
doc = "Revenu mensuel exonéré d'impôt sur le revenu"

[element.basic_rate]
label = "Taux de base de l'impôt sur le revenu"
doc = "Taux de l'impôt sur le revenu entre l'abattement et le seuil supérieur"

[element.higher_rate]
label = "Taux supérieur de l'impôt sur le revenu"
doc = "Taux de l'impôt sur le revenu au-dessus du seuil supérieur"

[element.vat_rate]
label = "Taux de TVA"
doc = "Taxe sur la valeur ajoutée sur la consommation des ménages"

[element.wage_bill_start]
