[element.wage_bill_desired]
label = "Masse salariale voulue par les entreprises"

[element.wage_bill_target]
label = "Masse salariale visée ce mois-ci"

[element.leave_prob]
label = "Probabilité de perdre son emploi"
doc = "Probabilité qu'un ménage en emploi soit sans travail ce mois-ci"

[element.hire_prob]
label = "Probabilité d'être embauché"
doc = "Probabilité qu'un ménage sans emploi soit embauché ce mois-ci"

[element.dividend_pool]
label = "Dividendes versés"

[element.total_equity]
label = "Actions émises"

[element.market_income]
label = "Revenu avant impôt"

[element.disposable_income]
label = "Revenu après impôts et prestations"

[element.consumption_total]
label = "Dépenses des ménages"

