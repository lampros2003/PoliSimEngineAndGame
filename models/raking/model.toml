# A test model for weights that change (format 1, stage S4.4): household weights raked
# to a population table. Generated by tools/make_raking.py; the numbers are invented.

[model]
id = "raking"
format = 1
title = "Raking test"
currency = "GBP"
minor_units = 100
step = "month"
phases = ["people", "alignment", "summary"]

[dim.region]
members = ["north", "midlands", "south"]

[dim.sex]
members = ["female", "male"]

[dim.band]
members = ["child", "young", "middle", "old"]
labels = ["Children", "16 to 34", "35 to 64", "65 and over"]

[dim.size]
doc = "People in a household"
range = [1, 6]

[entity.household]
data = "data/households.csv"
id = "id"
weight = { state = "household_weight" }

[entity.household.columns.region_code]
type = "int"
unit = "1"

[entity.household.columns.adults]
type = "int"
unit = "1"

[entity.household.columns.children]
type = "int"
unit = "person/household"

[entity.household.columns.household_size]
doc = "People in the household, as a member of the size dimension"
type = "int"
unit = "1"

[entity.household.columns.sex1]
type = "int"
unit = "1"

[entity.household.columns.band1]
type = "int"
unit = "1"

[entity.household.columns.sex2]
type = "int"
unit = "1"

[entity.household.columns.band2]
type = "int"
unit = "1"

[entity.household.columns.sex3]
type = "int"
unit = "1"

[entity.household.columns.band3]
type = "int"
unit = "1"

# ------------------------------------------------------------------ the population

[param.growth]
label = "Growth a month by age band"
type = "real"
unit = "1"
dims = ["band"]
data = "data/growth.csv"

[param.regional_growth]
type = "real"
unit = "1"
dims = ["region"]
data = "data/regional_growth.csv"

[param.person]
doc = "One person per household: turns a count of adults into people"
type = "int"
unit = "person/household"
value = 1

[param.households_by_size]
doc = "A whole-number target on a range dimension that does not start at zero"
type = "int"
unit = "household"
dims = ["size"]
data = "data/sizes.csv"

[lever.old_age_growth]
label = "Extra growth a month of people 65 and over"
type = "real"
unit = "1"
default = 0.0
range = [-0.01, 0.01]

[lever.align]
label = "Rake the weights once a year"
type = "bool"
default = true

[state.people]
label = "Population"
type = "real"
unit = "person"
phase = "people"
dims = ["region", "sex", "band"]
initial = { data = "data/people.csv" }
next = "people * (1.0 + growth + regional_growth + select(coord(band) == 3, old_age_growth, 0.0))"

[state.month_of_year]
type = "int"
unit = "1"
phase = "summary"
initial = 0
next = "select(month_of_year == 11, 0, month_of_year + 1)"

[var.households_before]
doc = "Read before the weights change: the start-of-step weights"
type = "int"
unit = "household"
phase = "people"
expr = "wcount(household, true)"

# ------------------------------------------------------------------ alignment

[var.adults_target]
type = "real"
unit = "person"
phase = "alignment"
dims = ["region", "sex", "band"]
expr = "select(coord(band) == 0, 0.0, people)"

[var.children_target]
type = "real"
unit = "person"
phase = "alignment"
dims = ["region"]
expr = "sum(people[band: child], sex)"

[state.household_weight]
label = "Household weight"
entity = "household"
type = "int"
unit = "1"
phase = "alignment"
initial = { column = "weight" }

[state.household_weight.rake]
when = "align and month_of_year == 0"
passes = 4

[[state.household_weight.rake.margin]]
target = "adults_target"
slots = [
  { count = "select(adults >= 1, person, 0)", at = ["region_code", "sex1", "band1"] },
  { count = "select(adults >= 2, person, 0)", at = ["region_code", "sex2", "band2"] },
  { count = "select(adults >= 3, person, 0)", at = ["region_code", "sex3", "band3"] },
]

[[state.household_weight.rake.margin]]
target = "children_target"
slots = [{ count = "children", at = ["region_code"] }]

[[state.household_weight.rake.margin]]
target = "households_by_size"
slots = [{ count = "1", at = ["household_size"] }]

# ------------------------------------------------------------------ summaries

[var.households]
type = "int"
unit = "household"
phase = "summary"
initial = 0
expr = "wcount(household, true)"

[var.people_total]
type = "real"
unit = "person"
phase = "summary"
expr = "sum(people, region, sex, band)"

[var.people_in_households]
type = "int"
unit = "person"
phase = "summary"
expr = "wsum(household, adults * person + children)"

[var.children_by_region]
type = "int"
unit = "person"
phase = "summary"
dims = ["region"]
expr = "wsum_by(household, children, region, region_code)"

[var.children_fit]
doc = "Weighted children against their target, summed over regions (3 when every region fits)"
type = "real"
unit = "1"
phase = "summary"
expr = "sum(children_by_region / children_target, region)"

[var.households_by_size_now]
type = "int"
unit = "household"
phase = "summary"
dims = ["size"]
expr = "wcount_by(household, true, size, household_size)"

[var.size_gap]
doc = "Households by size against the target: the last margin, met to within rounding"
type = "int"
unit = "household"
phase = "summary"
expr = "sum(abs(households_by_size_now - households_by_size), size)"

[var.weight_change]
type = "int"
unit = "household"
phase = "summary"
expr = "wsum(household, 1) - prev(households)"

[var.heavy_households]
doc = "A record formula reading the weight state itself"
type = "int"
unit = "household"
phase = "summary"
expr = "wcount(household, household_weight > 3000)"
