# Greenhouse gas emissions (stage S8.2). GENERATED by tools/uk/calibrate.py from
# tools/uk/emissions.py and models/uk/data/emissions.csv (ONS atmospheric emissions
# accounts, 2024); do not edit.
#
# Each industry emits its 2024 tonnes per pound of output at constant prices, and
# households theirs per pound of spending; both fall with a trend, faster with a carbon price, which firms and
# households pay to the government on the previous month's emissions.

[param.industry_emissions_2024]
doc = "Each industry's greenhouse gas emissions in 2024, a month"
type = "real"
unit = "tonne/month"
dims = ["industry"]
data = "emissions/industries.csv"
column = "tonnes"

[param.household_emissions_2024]
doc = "Households' own greenhouse gas emissions in 2024 (heating, cars), a month"
type = "real"
unit = "tonne/month"
value = 10323333.333333334

[param.emissions_2024]
doc = "All greenhouse gas emissions in 2024, a month: where the path to net zero starts"
type = "real"
unit = "tonne/month"
value = 39815083.333333336

[param.intensity_fall]
doc = "Monthly fall in emissions per pound of output without a carbon price (a judgement: about 3% a year)"
type = "real"
unit = "1"
low = 0.001682142552739574
central = 0.002535048613836688
high = 0.003396053198917559

[param.carbon_price_response]
doc = "Further monthly fall in emissions per pound of output, per penny of carbon price a tonne (a judgement: 2% a year more at £100 a tonne)"
type = "real"
unit = "tonne/GBP"
low = 8.371773591205889e-08
central = 1.682142552739574e-07
high = 2.535048613836688e-07

[lever.carbon_price]
label = "Carbon price"
group = "Environment"
type = "money"
unit = "GBP/tonne"
default = 0
range = [0, 300]
leaning = "left"
doc = "A price on every tonne of greenhouse gas, on top of today's policies; firms and households pay it to the government"

[state.months_elapsed]
doc = "Months since the game began"
type = "int"
unit = "1"
phase = "accounts"
initial = 0
next = "months_elapsed + 1"

[state.emission_intensity]
label = "Emissions per pound, against 2024"
doc = "Emissions per pound of output or spending, against 2024"
type = "real"
unit = "1"
phase = "accounts"
initial = 1.0
next = "emission_intensity * (1.0 - intensity_fall - carbon_price_response * carbon_price)"

[var.industry_output_first]
doc = "Each industry's output in the first month, at its prices"
type = "real"
unit = "GBP/month"
phase = "accounts"
dims = ["industry"]
expr = "select(prev(industry_output_first) > 0.0, prev(industry_output_first), industry_output / price_index)"
initial = 0.0

[var.consumption_first]
doc = "Household spending in the first month, at its prices"
type = "real"
unit = "GBP/month"
phase = "accounts"
expr = "select(prev(consumption_first) > 0.0, prev(consumption_first), consumption / consumer_price_index)"
initial = 0.0

[var.industry_emissions]
label = "Emissions, by industry"
doc = "Greenhouse gases each industry emits, in tonnes of carbon dioxide equivalent a month"
type = "real"
unit = "tonne/month"
phase = "accounts"
dims = ["industry"]
expr = "industry_emissions_2024 * (industry_output / price_index) / industry_output_first * emission_intensity"

[var.firm_emissions]
label = "Industries' emissions"
type = "real"
unit = "tonne/month"
phase = "accounts"
expr = "sum(industry_emissions, industry)"
# The carbon tax reads last month's; in the first month, 2024's.
initial = 29491750.0

[var.household_emissions]
label = "Households' emissions"
doc = "Greenhouse gases households emit themselves, heating homes and driving, a month"
type = "real"
unit = "tonne/month"
phase = "accounts"
expr = "household_emissions_2024 * (consumption / consumer_price_index) / consumption_first * emission_intensity"
initial = 10323333.333333334

[var.emissions]
label = "Greenhouse gas emissions"
doc = "All greenhouse gases, in tonnes of carbon dioxide equivalent a month"
type = "real"
unit = "tonne/month"
phase = "accounts"
expr = "firm_emissions + household_emissions"

[var.net_zero_path]
label = "Path to net zero"
doc = "Emissions falling in a straight line from 2024's (in mid-2024) to nothing in mid-2050"
type = "real"
unit = "tonne/month"
phase = "accounts"
expr = "emissions_2024 * max(1.0 - (months_elapsed + 6.5) / 312.0, 0.0)"

[flow.carbon_tax_firms]
label = "Carbon price paid by firms"
from = "firms"
to = "government"
phase = "spending"
expr = "round(carbon_price * prev(firm_emissions))"

[flow.carbon_tax_households]
label = "Carbon price paid by households"
from = "households"
to = "government"
phase = "spending"
expr = "round(carbon_price * prev(household_emissions))"
