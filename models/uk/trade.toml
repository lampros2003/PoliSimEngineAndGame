# The UK's trade by partner (stage S6.3). GENERATED by tools/uk/calibrate.py from
# tools/uk/trade.py and models/uk/data/trade_partners.csv (ONS, 2024); do not edit.

[dim.partner]
members = ["eu", "united_states", "china", "rest_of_world"]
labels = ["The EU", "The United States", "China", "The rest of the world"]

[param.export_share_by_partner]
doc = "Each partner's share of UK exports, 2024"
type = "real"
unit = "1"
dims = ["partner"]
data = "trade/shares.csv"
column = "exports"

[param.import_share_by_partner]
doc = "Each partner's share of UK imports, 2024"
type = "real"
unit = "1"
dims = ["partner"]
data = "trade/shares.csv"
column = "imports"

[param.partner_growth_premium]
doc = "Monthly growth of each partner's demand for UK exports beyond world demand's (a judgement)"
type = "real"
unit = "1"
dims = ["partner"]
data = "trade/shares.csv"
column = "growth_premium"

[param.trade_response]
doc = "How far trade with a partner falls per unit of barrier (imports, and exports through retaliation)"
type = "real"
unit = "1"
low = 1.0
central = 2.0
high = 3.0

[lever.trade_barrier_eu]
label = "Trade barriers with the EU"
group = "Trade"
type = "real"
unit = "1"
default = 0.0
range = [0.0, 0.5]
doc = "Tariffs and other barriers on imports from this partner, as a share of their price; it retaliates in kind"

[lever.trade_barrier_united_states]
label = "Trade barriers with the United States"
group = "Trade"
type = "real"
unit = "1"
default = 0.0
range = [0.0, 0.5]
doc = "Tariffs and other barriers on imports from this partner, as a share of their price; it retaliates in kind"

[lever.trade_barrier_china]
label = "Trade barriers with China"
group = "Trade"
type = "real"
unit = "1"
default = 0.0
range = [0.0, 0.5]
doc = "Tariffs and other barriers on imports from this partner, as a share of their price; it retaliates in kind"

[lever.trade_barrier_rest_of_world]
label = "Trade barriers with the rest of the world"
group = "Trade"
type = "real"
unit = "1"
default = 0.0
range = [0.0, 0.5]
doc = "Tariffs and other barriers on imports from this partner, as a share of their price; it retaliates in kind"

[state.partner_index]
label = "Demand for UK exports by partner (first month = 1)"
type = "real"
unit = "1"
phase = "accounts"
dims = ["partner"]
initial = 1.0
next = "partner_index * (1.0 + world_growth + partner_growth_premium)"

[var.partner_barrier]
type = "real"
unit = "1"
phase = "spending"
dims = ["partner"]
expr = "select(coord(partner) == 0, trade_barrier_eu, select(coord(partner) == 1, trade_barrier_united_states, select(coord(partner) == 2, trade_barrier_china, trade_barrier_rest_of_world)))"

[var.exports_by_partner]
label = "Exports by partner"
type = "real"
unit = "GBP/month"
phase = "spending"
dims = ["partner"]
expr = "exports_base * export_share_by_partner * partner_index * export_demand * max(1.0 - trade_response * partner_barrier, 0.0)"

[var.imports_by_partner]
label = "Imports by partner"
type = "real"
unit = "GBP/month"
phase = "spending"
dims = ["partner"]
expr = "import_share * import_propensity * private_demand * import_share_by_partner * max(1.0 - trade_response * partner_barrier, 0.0)"

[flow.customs_duties]
label = "Customs duties"
from = "firms"
to = "government"
phase = "spending"
expr = "round(sum(partner_barrier * imports_by_partner, partner))"
