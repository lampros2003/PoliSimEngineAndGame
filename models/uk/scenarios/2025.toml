  { row = "gilt_yield_now", icon = "debt", size = 2, better = "low" },
  # Stage S14.5: Bank Rate (neither good nor bad) and productivity; the mortgage rate is in Housing.
  { row = "bank_rate", icon = "bank-rate", size = 2 },
  { row = "productivity", icon = "productivity", size = 2, better = "high" },
  { row = "pay_per_employee_job", icon = "pay", size = 2, better = "high" },
  { row = "business_investment", icon = "investment", size = 1, better = "high" },
  # Stage S15.2
  { row = "business_confidence", icon = "business-confidence", size = 2, better = "high" },
  { row = "strike_days", icon = "strikes", size = 2, better = "low", unit = "count" },
  { row = "research_development", icon = "research", size = 1, better = "high" },
