# A five-year parliament from January 2025, starting from the 2024 accounts.

[scenario]
model = ".."
seed = 2025
steps = 60
preset = "central"

[play]
# Stage S7.1: listed on the start screen.
title = "The United Kingdom, 2025"
summary = "Govern the United Kingdom from January 2025, with 411 of the 650 seats in the Commons, through the general election due in July 2029."
country = "United Kingdom"
currency_symbol = "£"
currency_name = "pounds"
start = "2025-01"
term = 60
government = "government"
# Amounts paid each month are shown at an annual rate, as the public finances are published.
amounts = "year"
# Stage S13.2: short names for the top bar and the board.
labels = { government_support = "Approval", gdp = "GDP", unemployment_rate = "Unemployment", consumer_inflation_annual = "Inflation", budget_balance = "Budget balance", debt_to_gdp = "Debt to GDP", output_growth = "Growth", pay_per_employee_job = "Pay per job", workforce_jobs = "Jobs", public_receipts = "Tax receipts", poverty_rate = "Poverty", child_poverty_rate = "Child poverty", pensioner_poverty_rate = "Pensioner poverty", working_age_poverty_rate = "Working-age poverty", median_income = "Median income", net_income_average = "Household income", treatments = "NHS treatments", service_level_overall = "Public services", household_emissions = "Homes' emissions", emissions = "Emissions", dwellings = "Home building" }
headline = ["government_support", "gdp", "unemployment_rate", "consumer_inflation_annual", "budget_balance", "debt_to_gdp"]
watch = ["gdp", "unemployment_rate", "budget_balance", "debt_to_gdp", "consumer_inflation_annual", "waiting_list"]
# "Who gains, who loses": net income per household by group, from the households; jobs and
# pay by industry (stage S6.4).
breakdowns = ["net_income_by_decile", "net_income_by_household_type", "net_income_by_region",
              "industry_jobs", "industry_pay_per_employee", "service_level", "spending_by_function",
              "industry_emissions", "poverty_by_group"]
breakdown_all = "net_income_average"
breakdown_totals = { poverty_by_group = "poverty_rate", industry_jobs = "workforce_jobs", industry_pay_per_employee = "pay_per_employee_job", service_level = "service_level_overall", spending_by_function = "public_services_spending", industry_emissions = "firm_emissions" }

# Stage S5.5: the politics panel and election night.
[play.politics]
intention = "vote_intention"
seats = "seats"
projected = "projected_seats"
governing = "governing"
support = "government_support"
turnout = "turnout"
election = "election_now"
months_to_election = "months_to_election"
player = "player_governs"
majority = 326
# Stage S8.3: the issues voters weigh, now and at the last election.
issues = "issue_measure"
issues_at_election = "issue_at_election"

# Stage S13.2: the board, the game's one screen. Read by the client only; the engine
# ignores it, so no model hash changes with the layout.
#
#   [play.web]
#   hide = [lever, ...]            levers the player does not hold here (Scotland sets its
#                                  own income tax rates)
#   groups = [{ key, label, icon, row, share, family, note }, ...]
#                                  interest groups round the centre: `row` is the group's
#                                  approval and `share` its share of the electorate (national
#                                  result rows); `family` gathers groups on the board (a small
#                                  gap between families); `note`, if any, is said in place of
#                                  an approval of nought
#   group_drivers = { key = "value over the group dimension", ... }
#                                  what moves each group, read with cells()
#   group_driver_labels = { key = "plain name", ... }
#                                  the drivers' names on screen
#   household = { entity, support, net_income, change, adults, children, region, type,
#                 account = [...] }  sample households in a group's popup; a group's
#                                  `households` names the flag that picks them
#   [[play.web.areas]]            one per policy area, in order round the board
#   name, icon                     the area's name (set along the rim) and pictogram
#   policies = [{ key, label, icon, size, levers = [...] }]
#                                  a policy is one lever or several under one name; its
#                                  first lever sets its gauge; size 1 to 3 is importance
#   indicators = [{ row, icon, size, better }]
#                                  a national result row; `better` is "high" or "low" where
#                                  that is clear, and tints its rises and falls
#
# Icons are file names in client/icons (game-icons.net, credited in client/icons/CREDITS.md).
[play.web]
hide = ["starter_rate", "scottish_basic_rate", "scottish_basic_threshold", "intermediate_rate",
        "intermediate_threshold", "scottish_higher_rate", "scottish_higher_threshold", "advanced_rate",
        "advanced_threshold", "top_rate", "top_threshold"]
# Stage S13.4: the eighteen groups, in families round the centre (ages; incomes; work;
# families; places), and the five terms of what moves a group's vote, by plain name.
groups = [
  { key = "young", label = "The young", icon = "group-young", row = "approval_young", share = "share_young", households = "household_in_young", family = "Ages" },
  { key = "midlife", label = "Mid-life", icon = "group-midlife", row = "approval_midlife", share = "share_midlife", households = "household_in_midlife", family = "Ages" },
  { key = "pensioner", label = "Pensioners", icon = "pensioner", row = "approval_pensioners", share = "share_pensioners", households = "household_in_pensioners", family = "Ages" },
  { key = "low_income", label = "Low incomes", icon = "group-low-income", row = "approval_low_income", share = "share_low_income", households = "household_in_low_income", family = "Incomes" },
  { key = "middle_income", label = "Middle incomes", icon = "group-middle-income", row = "approval_middle_income", share = "share_middle_income", households = "household_in_middle_income", family = "Incomes" },
  { key = "high_income", label = "High incomes", icon = "group-high-income", row = "approval_high_income", share = "share_high_income", households = "household_in_high_income", family = "Incomes" },
  { key = "in_work", label = "In work", icon = "group-in-work", row = "approval_in_work", share = "share_in_work", households = "household_in_in_work", family = "Work" },
  { key = "out_of_work", label = "Out of work", icon = "group-out-of-work", row = "approval_out_of_work", share = "share_out_of_work", households = "household_in_out_of_work", family = "Work" },
  { key = "self_employed", label = "The self-employed", icon = "group-self-employed", row = "approval_self_employed", share = "share_self_employed", households = "household_in_self_employed", family = "Work" },
  { key = "parents", label = "Parents", icon = "group-parents", row = "approval_parents", share = "share_parents", households = "household_in_parents", family = "Families" },
  { key = "lone_parents", label = "Lone parents", icon = "group-lone-parents", row = "approval_lone_parents", share = "share_lone_parents", households = "household_in_lone_parents", family = "Families" },
  { key = "scotland", label = "Scotland", icon = "group-scotland", row = "approval_scotland", share = "share_scotland", households = "household_in_scotland", family = "Places" },
  { key = "wales", label = "Wales", icon = "group-wales", row = "approval_wales", share = "share_wales", households = "household_in_wales", family = "Places" },
  { key = "northern_ireland", label = "Northern Ireland", icon = "group-northern-ireland", row = "approval_northern_ireland", share = "share_northern_ireland", households = "household_in_northern_ireland", family = "Places", note = "The governing party does not stand in Northern Ireland, so none of its voters back it." },
  { key = "london", label = "London", icon = "group-london", row = "approval_london", share = "share_london", households = "household_in_london", family = "Places" },
  { key = "north", label = "The North", icon = "group-north", row = "approval_north", share = "share_north", households = "household_in_north", family = "Places" },
  { key = "midlands", label = "The Midlands", icon = "group-midlands", row = "approval_midlands", share = "share_midlands", households = "household_in_midlands", family = "Places" },
  { key = "south", label = "The South", icon = "group-south", row = "approval_south", share = "share_south", households = "household_in_south", family = "Places" },
]
group_drivers = { income = "group_driver_income", jobs = "group_driver_jobs", prices_and_time = "group_driver_prices_and_time", services = "group_driver_services", standing = "group_driver_standing" }
# Stage S13.4: a household as the group popup shows it: its flags and figures by name, the
# data columns read in words through a dimension's labels ("column:dimension"), and its
# account for the year (a "-" in front is taken away).
household = { entity = "household", support = "household_support", net_income = "net_income", change = "income_change", adults = "adults", children = "children", region = "region_code:region", type = "type:household_type", account = ["household_earnings", "household_pensions", "-income_tax_year", "-employee_ni_year", "household_benefits"] }
group_driver_labels = { income = "Their incomes", jobs = "Jobs where they live", prices_and_time = "Prices and time in office", services = "Public services and the climate", standing = "The government's decisions" }

[[play.web.areas]]
name = "Economy"
icon = "economy"
policies = [
  { key = "public_investment", label = "Public investment", icon = "public-investment", size = 2, levers = ["public_investment_bill"] },
  { key = "subsidies", label = "Subsidies to business", icon = "subsidies", size = 1, levers = ["subsidies_bill"] },
  { key = "government", label = "Running the government", icon = "government", size = 1, levers = ["spending_general"] },
]
indicators = [
  { row = "gdp", icon = "gdp", size = 3, better = "high" },
  { row = "unemployment_rate", icon = "unemployment", size = 3, better = "low" },
  { row = "consumer_inflation_annual", icon = "prices", size = 3, better = "low" },
  { row = "output_growth", icon = "growth", size = 2, better = "high" },
  { row = "pay_per_employee_job", icon = "pay", size = 2, better = "high" },
  { row = "workforce_jobs", icon = "jobs", size = 1, better = "high" },
  { row = "business_investment", icon = "investment", size = 1, better = "high" },
]

[[play.web.areas]]
name = "Tax"
icon = "tax"
policies = [
  { key = "income_tax", label = "Income tax", icon = "income-tax", size = 3, levers = ["basic_rate", "higher_rate", "additional_rate", "personal_allowance", "higher_threshold", "additional_threshold", "allowance_taper_start"] },
  { key = "national_insurance", label = "National Insurance", icon = "national-insurance", size = 3, levers = ["ni_main_rate", "ni_upper_rate", "ni_primary_threshold", "ni_upper_limit", "ni_employer_rate", "ni_secondary_threshold", "class4_main_rate", "class4_upper_rate", "class4_lower", "class4_upper"] },
  { key = "vat", label = "VAT", icon = "vat", size = 3, levers = ["vat_rate"] },
  { key = "corporation_tax", label = "Corporation tax", icon = "corporation-tax", size = 2, levers = ["corporation_tax_rate"] },
  { key = "council_tax", label = "Council tax", icon = "council-tax", size = 1, levers = ["council_tax_bill"] },
]
indicators = [
  { row = "budget_balance", icon = "balance", size = 3, better = "high" },
  { row = "debt_to_gdp", icon = "debt", size = 3, better = "low" },
  { row = "public_receipts", icon = "tax", size = 1 },
]

[[play.web.areas]]
name = "Welfare"
icon = "welfare"
policies = [
  { key = "universal_credit", label = "Universal Credit", icon = "universal-credit", size = 3, levers = ["uc_single", "uc_single_young", "uc_couple", "uc_couple_young", "uc_child", "uc_first_child_older", "uc_work_allowance", "uc_taper", "uc_child_limit"] },
  { key = "child_benefit", label = "Child Benefit", icon = "child-benefit", size = 2, levers = ["child_benefit_eldest", "child_benefit_other", "hicbc_start", "hicbc_width"] },
  { key = "pensions", label = "Pensions and benefits", icon = "pensions", size = 3, levers = ["benefits_bill"] },
  { key = "state_pension_age", label = "State Pension age", icon = "pension-age", size = 2, levers = ["state_pension_age"] },
  { key = "jobseekers", label = "Benefit for the unemployed", icon = "jobseekers", size = 1, levers = ["benefit_per_unemployed"] },
]
indicators = [
  { row = "poverty_rate", icon = "poverty", size = 3, better = "low" },
  { row = "child_poverty_rate", icon = "child", size = 2, better = "low" },
  { row = "median_income", icon = "income", size = 2, better = "high" },
  { row = "net_income_average", icon = "net-income", size = 3, better = "high" },
  { row = "pensioner_poverty_rate", icon = "pensioner", size = 1, better = "low" },
  { row = "working_age_poverty_rate", icon = "poverty", size = 1, better = "low" },
]

[[play.web.areas]]
name = "Health"
icon = "health"
policies = [
  { key = "nhs", label = "The NHS", icon = "hospital", size = 3, levers = ["spending_health"] },
  { key = "social_care", label = "Social care", icon = "social-care", size = 2, levers = ["spending_social_care"] },
]
indicators = [
  { row = "waiting_list", icon = "waiting-list", size = 3, better = "low" },
  { row = "treatments", icon = "treatments", size = 1, better = "high" },
]

[[play.web.areas]]
name = "Education"
icon = "education"
policies = [
  { key = "schools", label = "Schools and universities", icon = "school", size = 3, levers = ["spending_education"] },
  { key = "culture", label = "Culture and sport", icon = "culture", size = 1, levers = ["spending_culture"] },
]
indicators = [
  { row = "service_level_overall", icon = "service", size = 2, better = "high" },
