# A five-year parliament from January 2025, starting from the 2024 accounts.

[scenario]
model = ".."
seed = 2025
steps = 60
preset = "central"

# Stage S13.7 (docs/S13-BALANCE.md): this government wears faster than the model's fitted
# time in office alone, so that a term of doing nothing ends near the majority line rather
# than safely above it. Nil in the base month (politics/README.md, "Wear of office").
[params]
# Stage S15.2: -0.025 to -0.022, so that doing nothing stays within 320 to 332 seats now that
# rents, bills and public pay weigh with the new groups (docs/S13-BALANCE.md, "After S15.2").
vote_wear_effect = -0.022
# Stage S13.8 (docs/S13-BALANCE.md, "After S13.8"): lenders and voters mind the public
# finances (models/uk/finances.toml; politics/README.md, "The public finances"). Both are nil
# in the base month.
lender_premium_effect = 0.75
vote_finances_effect = 1.0

[play]
# Stage S7.1: listed on the start screen.
title = "The United Kingdom, 2025"
summary = "Govern the United Kingdom from January 2025, with 411 of the 650 seats in the Commons, through the general election due in July 2029."
country = "United Kingdom"
currency_symbol = "£"
currency_name = "pounds"
start = "2025-01"
term = 60
government = "government"
# Amounts paid each month are shown at an annual rate, as the public finances are published.
amounts = "year"
# Stage S13.2: short names for the top bar and the board. Stage S15.3: a policy's key gives it
# a shorter name on the board (its popup keeps the whole one).
labels = { schools = "Schools", culture = "Culture", policing = "Police and courts", housing = "Local services", government = "Running government", visa_threshold = "Visa threshold", prescription_charge = "Prescriptions", homelessness = "Homelessness", government_support = "Approval", gdp = "GDP", unemployment_rate = "Unemployment", consumer_inflation_annual = "Inflation", budget_balance = "Budget balance", debt_to_gdp = "Debt to GDP", output_growth = "Growth", pay_per_employee_job = "Pay per job", workforce_jobs = "Jobs", public_receipts = "Tax receipts", poverty_rate = "Poverty", child_poverty_rate = "Child poverty", pensioner_poverty_rate = "Pensioner poverty", working_age_poverty_rate = "Working-age poverty", median_income = "Median income", net_income_average = "Household income", treatments = "NHS treatments", service_level_overall = "Public services", household_emissions = "Homes' emissions", emissions = "Emissions", dwellings = "Housing stock", crime_incidents = "Crime", prison_population = "Prisoners", healthy_life_expectancy = "Healthy life", smoking_prevalence = "Smoking", alcohol_deaths = "Alcohol deaths", ev_share = "Electric cars", school_attainment = "School results", homes_built = "Homes built", net_migration_annual = "Net migration", inequality = "Inequality", tax_burden = "Tax burden", rents = "Rents", house_prices = "House prices", energy_bills = "Energy bills", strike_days = "Days lost to strikes", business_confidence = "Business confidence", farm_incomes = "Farm incomes", congestion = "Congestion", air_pollution = "Air pollution", research_development = "Research", trade_balance = "Trade balance", bank_rate = "Bank Rate", mortgage_rate = "Mortgage rate", productivity = "Productivity", stance_state = "State or market", stance_order = "Liberty or order", stance_green = "Green", stance_nation = "The nation" }
headline = ["government_support", "gdp", "unemployment_rate", "consumer_inflation_annual", "budget_balance", "debt_to_gdp"]
watch = ["gdp", "unemployment_rate", "budget_balance", "debt_to_gdp", "consumer_inflation_annual", "waiting_list"]
# "Who gains, who loses": net income per household by group, from the households; jobs and
# pay by industry (stage S6.4).
breakdowns = ["net_income_by_decile", "net_income_by_household_type", "net_income_by_region",
              "industry_jobs", "industry_pay_per_employee", "service_level", "spending_by_function",
              "industry_emissions", "poverty_by_group"]
breakdown_all = "net_income_average"
breakdown_totals = { poverty_by_group = "poverty_rate", industry_jobs = "workforce_jobs", industry_pay_per_employee = "pay_per_employee_job", service_level = "service_level_overall", spending_by_function = "public_services_spending", industry_emissions = "firm_emissions" }

# Stage S5.5: the politics panel and election night.
[play.politics]
intention = "vote_intention"
seats = "seats"
projected = "projected_seats"
governing = "governing"
support = "government_support"
# Stage S13.7: the player's own bloc's rating: the centre of the board and the top bar's
# "Approval" show it, so a coalition does not make approval jump; political capital is
# earned on it.
own = "own_support"
turnout = "turnout"
election = "election_now"
months_to_election = "months_to_election"
player = "player_governs"
majority = 326
# Stage S8.3: the issues voters weigh, now and at the last election.
issues = "issue_measure"
issues_at_election = "issue_at_election"

# Stage S13.2: the board, the game's one screen. Read by the client only; the engine
# ignores it, so no model hash changes with the layout.
#
#   [play.web]
#   hide = [lever, ...]            levers the player does not hold here (Scotland sets its
#                                  own income tax rates)
#   groups = [{ key, label, icon, row, share, family, note }, ...]
#                                  interest groups round the centre: `row` is the group's
#                                  approval and `share` its share of the electorate (national
#                                  result rows); `family` gathers groups on the board (a small
#                                  gap between families); `note`, if any, is said in place of
#                                  an approval of nought
#   group_drivers = { key = "value over the group dimension", ... }
#                                  what moves each group, read with cells()
#   group_driver_labels = { key = "plain name", ... }
#                                  the drivers' names on screen
#   household = { entity, support, net_income, change, adults, children, region, type,
#                 account = [...] }  sample households in a group's popup; a group's
#                                  `households` names the flag that picks them
#   [[play.web.areas]]            one per policy area, in order round the board
#   name, icon                     the area's name (set along the rim) and pictogram
#   policies = [{ key, label, icon, size, levers = [...] }]
#                                  a policy is one lever or several under one name; its
#                                  first lever sets its gauge; size 1 to 3 is importance
#   indicators = [{ row, icon, size, better }]
#                                  a national result row; `better` is "high" or "low" where
#                                  that is clear: it sets the node's colour (high green, a
#                                  good thing; low red, a bad thing; none blue) and tints
#                                  its rises and falls
#
# Stage S13.5: real policies, a growing board, estimated groups.
#   a policy's `levels = ["...", ...]`  the names of a level policy's settings, in order from
#                                  the lever's minimum: chosen by name, never as a number
#   a policy's `off = <value>`     the setting (as typed: pounds for money) at which it is
#                                  not in force: off the board, offered by the area's
#                                  "introduce a policy" node, and "Repeal" when in force
#   a policy's `line = "..."`      one line on what it does, in the area's introduce list
#   `unit` on a policy or an indicator, how its value reads: "years" (an age, a life:
#                                  "18 years"), "year" (a calendar year: "2030"), "multiple"
#                                  (of 2024's rates: "as now", "+20%"), "pence" ("52.95p"),
#                                  "count" (a plain number: "9,200,000")
#   a policy's `per = "..."`       what its amount is for: "a car" reads "£2,500 a car"
#   a group's `estimate = "..."`   for a group with no households: where its membership is
#                                  estimated from, said in its popup in their place
#
# Stage S14.1: the board as the screen.
#   approval_good, approval_bad    the approval from which a group's arc is green, and below
#                                  which it is red (mustard between); 0.38 and 0.28 if absent
#   an indicator's `better`        also its colour: "high" a good thing (green), "low" a bad
#                                  thing (red), none neither (blue)
#
# Icons are file names in client/icons (game-icons.net, credited in client/icons/CREDITS.md).
[play.web]
hide = ["starter_rate", "scottish_basic_rate", "scottish_basic_threshold", "intermediate_rate",
        "intermediate_threshold", "scottish_higher_rate", "scottish_higher_threshold", "advanced_rate",
        "advanced_threshold", "top_rate", "top_threshold"]
# Stage S15.2: seven families (docs/S15-PLAN.md, Groups); the regions and smokers stay in the
# model and in Parliament but leave the ring. Seven terms of what moves a group, by plain name.
groups = [
  # Beliefs: where the government stands moves them (models/uk/politics/README.md).
  { key = "socialists", label = "Socialists", icon = "group-socialists", row = "approval_socialists", share = "share_socialists", family = "Beliefs", estimate = "British Social Attitudes' left of the economic scale, by age, income and region" },
  { key = "capitalists", label = "Capitalists", icon = "group-capitalists", row = "approval_capitalists", share = "share_capitalists", family = "Beliefs", estimate = "British Social Attitudes' right of the economic scale, by age, income and region" },
  { key = "liberals", label = "Liberals", icon = "group-liberals", row = "approval_liberals", share = "share_liberals", family = "Beliefs", estimate = "British Social Attitudes' libertarian end, by age, income and region" },
  { key = "conservatives", label = "Conservatives", icon = "group-conservatives", row = "approval_conservatives", share = "share_conservatives", family = "Beliefs", estimate = "British Social Attitudes' authoritarian end, by age, income and region" },
  { key = "environmentalists", label = "Environmentalists", icon = "group-environmentalists", row = "approval_environmentalists", share = "share_environmentalists", family = "Beliefs", estimate = "the British Election Study's priority for the environment, by age, income and region" },
  { key = "patriots", label = "Patriots", icon = "group-patriots", row = "approval_patriots", share = "share_patriots", family = "Beliefs", estimate = "the British Election Study's national identity, by age, income and region" },
  { key = "in_work", label = "In work", icon = "group-in-work", row = "approval_in_work", share = "share_in_work", households = "household_in_in_work", family = "Work" },
  { key = "out_of_work", label = "Out of work", icon = "group-out-of-work", row = "approval_out_of_work", share = "share_out_of_work", households = "household_in_out_of_work", family = "Work" },
  { key = "self_employed", label = "The self-employed", icon = "group-self-employed", row = "approval_self_employed", share = "share_self_employed", households = "household_in_self_employed", family = "Work" },
  { key = "public_sector", label = "Public sector workers", icon = "group-public-sector", row = "approval_public_sector", share = "share_public_sector", family = "Work", estimate = "the ONS's public sector employment, 6.1 million, by age, income and region" },
  { key = "trade_unionists", label = "Trade unionists", icon = "group-trade-unionists", row = "approval_trade_unionists", share = "share_trade_unionists", family = "Work", estimate = "the government's trade union membership statistics, 6.4 million, by pay and region" },
  { key = "farmers", label = "Farmers", icon = "group-farmers", row = "approval_farmers", share = "share_farmers", family = "Work", estimate = "Defra's agricultural workforce, 453,000, by age and region" },
  { key = "home_owners", label = "Home owners", icon = "group-home-owners", row = "approval_home_owners", share = "share_home_owners", family = "Homes and places", estimate = "the English Housing Survey's share of households who own their home, by age and income" },
  { key = "renters", label = "Renters", icon = "group-renters", row = "approval_renters", share = "share_renters", family = "Homes and places", estimate = "the English Housing Survey: everyone who does not own their home" },
  { key = "town", label = "Town and city", icon = "group-town", row = "approval_town", share = "share_town", family = "Homes and places", estimate = "the rural-urban classification: everyone outside rural areas" },
  { key = "countryside", label = "Countryside", icon = "group-countryside", row = "approval_countryside", share = "share_countryside", family = "Homes and places", estimate = "the rural-urban classification's rural share of each region" },
  { key = "young", label = "The young", icon = "group-young", row = "approval_young", share = "share_young", households = "household_in_young", family = "Ages" },
  { key = "midlife", label = "Mid-life", icon = "group-midlife", row = "approval_midlife", share = "share_midlife", households = "household_in_midlife", family = "Ages" },
  { key = "pensioner", label = "Pensioners", icon = "pensioner", row = "approval_pensioners", share = "share_pensioners", households = "household_in_pensioners", family = "Ages" },
  { key = "low_income", label = "Low incomes", icon = "group-low-income", row = "approval_low_income", share = "share_low_income", households = "household_in_low_income", family = "Incomes" },
  { key = "middle_income", label = "Middle incomes", icon = "group-middle-income", row = "approval_middle_income", share = "share_middle_income", households = "household_in_middle_income", family = "Incomes" },
  { key = "high_income", label = "High incomes", icon = "group-high-income", row = "approval_high_income", share = "share_high_income", households = "household_in_high_income", family = "Incomes" },
  { key = "parents", label = "Parents", icon = "group-parents", row = "approval_parents", share = "share_parents", households = "household_in_parents", family = "Families" },
  { key = "lone_parents", label = "Lone parents", icon = "group-lone-parents", row = "approval_lone_parents", share = "share_lone_parents", households = "household_in_lone_parents", family = "Families" },
  { key = "motorists", label = "Motorists", icon = "group-motorists", row = "approval_motorists", share = "share_motorists", family = "Ways of life", estimate = "the National Travel Survey's share of households with a car, by income" },
  { key = "drinkers", label = "Drinkers", icon = "group-drinkers", row = "approval_drinkers", share = "share_drinkers", family = "Ways of life", estimate = "the Health Survey for England's share who drank in the last week, by age" },
]
group_drivers = { income = "group_driver_income", jobs = "group_driver_jobs", prices_and_time = "group_driver_prices_and_time", services = "group_driver_services", standing = "group_driver_standing", finances = "group_driver_finances", stances = "group_driver_stances", conditions = "group_driver_conditions" }
# Stage S13.4: a household as the group popup shows it: its flags and figures by name, the
# data columns read in words through a dimension's labels ("column:dimension"), and its
# account for the year (a "-" in front is taken away).
household = { entity = "household", support = "household_support", net_income = "net_income", change = "income_change", adults = "adults", children = "children", region = "region_code:region", type = "type:household_type", account = ["household_earnings", "household_pensions", "-income_tax_year", "-employee_ni_year", "household_benefits"] }
group_driver_labels = { income = "Their incomes", jobs = "Jobs where they live", prices_and_time = "Prices and time in office", services = "Public services and the climate", standing = "The government's decisions", finances = "The public finances", stances = "Where the government stands", conditions = "Rents, bills, pay and farm incomes" }
# Stage S14.1: a group's approval arc is green from approval_good, red below approval_bad,
# mustard between (the share of its likely voters who back the government).
# Stage S15.2: the row whose node a situation belongs to (the client lights it). The model's
# [situation] tables take no other key, so the mapping is here.
situations = { recession = "output_growth", strong_growth = "output_growth", high_unemployment = "unemployment_rate", high_inflation = "consumer_inflation_annual", debt_above_output = "debt_to_gdp", budget_surplus = "budget_balance", no_majority = "government_support", health_strain = "waiting_list", schools_strain = "school_attainment", policing_strain = "crime_incidents", services_improving = "service_level_overall", emissions_above_path = "emissions", emissions_on_track = "emissions", waiting_list_record = "waiting_list", waiting_list_falling = "waiting_list", crime_wave = "crime_incidents", healthy_life_falling = "healthy_life_expectancy", housing_shortage = "homes_built", building_boom = "homes_built", migration_high = "net_migration_annual", migration_falling = "net_migration_annual", lenders_confidence = "gilt_yield_now", homelessness_rising = "homelessness", strike_wave = "strike_days", rents_soaring = "rents" }
approval_good = 0.38
approval_bad = 0.28
# Stage S15.3: Parliament's four stances, each a scale with the belief groups at its ends
# (`low_group` and `high_group` by key; `low` and `high` the ends' words), and the country by
# place, the regions that left the ring (`note` said in place of an approval of nought).
stances = [
  { row = "stance_state", label = "The state against the market", low = "The market", high = "The state", low_group = "capitalists", high_group = "socialists" },
  { row = "stance_order", label = "Liberty against order", low = "Liberty", high = "Order", low_group = "liberals", high_group = "conservatives" },
  { row = "stance_green", label = "Green", low = "Less green", high = "Greener", high_group = "environmentalists" },
  { row = "stance_nation", label = "The nation", low = "The world", high = "The nation", high_group = "patriots" },
]
places = [
  { label = "Scotland", row = "approval_scotland", share = "share_scotland" },
  { label = "Wales", row = "approval_wales", share = "share_wales" },
  { label = "Northern Ireland", row = "approval_northern_ireland", share = "share_northern_ireland", note = "The governing party does not stand in Northern Ireland, so none of its voters back it." },
  { label = "London", row = "approval_london", share = "share_london" },
  { label = "The North", row = "approval_north", share = "share_north" },
  { label = "The Midlands", row = "approval_midlands", share = "share_midlands" },
  { label = "The South", row = "approval_south", share = "share_south" },
]

