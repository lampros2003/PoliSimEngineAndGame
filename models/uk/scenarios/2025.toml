name = "Economy"
icon = "economy"
policies = [
  { key = "public_investment", label = "Public investment", icon = "public-investment", size = 2, levers = ["public_investment_bill"] },
  { key = "subsidies", label = "Subsidies to business", icon = "subsidies", size = 1, levers = ["subsidies_bill"] },
  { key = "government", label = "Running the government", icon = "government", size = 1, levers = ["spending_general"] },
  # Stage S15.2: two in force at a neutral setting, three to introduce.
  { key = "public_pay_policy", label = "Public sector pay", icon = "pay", size = 2, levers = ["public_pay_settlement"] },
  { key = "trade_union_law", label = "Trade union law", icon = "union", size = 2, levers = ["trade_union_law"], levels = ["Stronger unions", "As now", "Tighter ballots and notice"] },
