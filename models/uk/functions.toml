# Public spending by function (stage S8.0). GENERATED by tools/uk/calibrate.py from
# tools/uk/functions.py and models/uk/data/functions.csv (HM Treasury, PESA 2025); do not
# edit.
#
# A lever per function, in 2024 prices. Each function's pay and purchases keep their 2024
# split, and the economy reads their sums, the public pay bill and purchases, as before.

[dim.function]
members = ["health", "education", "defence", "public_order", "transport", "social_care", "environment_housing", "culture", "general"]
labels = ["Health", "Education", "Defence", "Police, courts and prisons", "Transport", "Social care", "Environment and housing", "Culture, sport and recreation", "Government and the economy"]

[param.function_pay]
doc = "Each function's pay bill, 2024, a month"
type = "money"
unit = "GBP/month"
dims = ["function"]
data = "functions/split.csv"
column = "pay"

[param.function_spending]
doc = "Each function's pay and purchases, 2024, a month"
type = "money"
unit = "GBP/month"
dims = ["function"]
data = "functions/split.csv"
column = "spending"

[param.function_products]
doc = "Domestic product bought per pound of each function's spending"
type = "real"
unit = "1"
dims = ["function", "product"]
data = "functions/products.csv"

[lever.spending_health]
label = "Health"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 21654938439
range = [0, 43309876878]
leaning = "left"
doc = "The NHS and other health services: their staff and what they buy, in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"
capital_weight = 3

[lever.spending_education]
label = "Education"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 10895455885
range = [0, 21790911770]
leaning = "left"
doc = "Schools, colleges, universities and the rest of education, in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"
capital_weight = 3

[lever.spending_defence]
label = "Defence"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 3750511709
range = [0, 7501023418]
leaning = "left"
doc = "The armed forces, their equipment and the rest of defence, in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"

[lever.spending_public_order]
label = "Police, courts and prisons"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 4533814685
range = [0, 9067629370]
leaning = "left"
doc = "Public order and safety: the police, fire services, courts and prisons, in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"
capital_weight = 3

[lever.spending_transport]
label = "Transport"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 1629022136
range = [0, 3258044272]
leaning = "left"
doc = "Roads, railways and the rest of transport, in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"

[lever.spending_social_care]
label = "Social care"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 4549904660
range = [0, 9099809320]
leaning = "left"
doc = "Adult and children's social care and the other services of social protection (not benefits, which are separate), in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"
capital_weight = 3

[lever.spending_environment_housing]
label = "Environment and housing"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 1213728055
range = [0, 2427456110]
leaning = "left"
doc = "Waste, pollution and nature; housing and local amenities, in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"

[lever.spending_culture]
label = "Culture, sport and recreation"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 970001248
range = [0, 1940002496]
leaning = "left"
doc = "Museums, libraries, sport, broadcasting and the arts, in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"

[lever.spending_general]
label = "Government and the economy"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 2248539850
range = [0, 4497079700]
leaning = "left"
doc = "Running government, foreign affairs, and support for business, science, jobs and farming, in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"

[var.public_pay_bill]
label = "Public sector pay bill (2024 prices)"
type = "money"
unit = "GBP/month"
phase = "labour"
doc = "The functions' pay, each at its 2024 share of the function's spending"
expr = "muldiv(spending_health, function_pay[function: 0], function_spending[function: 0]) + muldiv(spending_education, function_pay[function: 1], function_spending[function: 1]) + muldiv(spending_defence, function_pay[function: 2], function_spending[function: 2]) + muldiv(spending_public_order, function_pay[function: 3], function_spending[function: 3]) + muldiv(spending_transport, function_pay[function: 4], function_spending[function: 4]) + muldiv(spending_social_care, function_pay[function: 5], function_spending[function: 5]) + muldiv(spending_environment_housing, function_pay[function: 6], function_spending[function: 6]) + muldiv(spending_culture, function_pay[function: 7], function_spending[function: 7]) + muldiv(spending_general, function_pay[function: 8], function_spending[function: 8])"

[var.procurement_bill]
label = "Purchases of goods and services (2024 prices)"
type = "money"
unit = "GBP/month"
phase = "labour"
doc = "The functions' spending other than pay"
expr = "spending_health + spending_education + spending_defence + spending_public_order + spending_transport + spending_social_care + spending_environment_housing + spending_culture + spending_general - public_pay_bill"

[var.spending_by_function]
label = "Spending, by function"
doc = "Each function's pay and purchases, at this month's prices"
type = "real"
unit = "GBP/month"
phase = "accounts"
dims = ["function"]
expr = "select(coord(function) == 0, spending_health, select(coord(function) == 1, spending_education, select(coord(function) == 2, spending_defence, select(coord(function) == 3, spending_public_order, select(coord(function) == 4, spending_transport, select(coord(function) == 5, spending_social_care, select(coord(function) == 6, spending_environment_housing, select(coord(function) == 7, spending_culture, spending_general)))))))) * trend_index"

[var.government_demand]
label = "Government demand for UK products"
type = "real"
unit = "GBP/month"
phase = "accounts"
dims = ["product"]
expr = "sum(spending_by_function * function_products, function)"

[var.public_services_spending]
label = "Public services"
doc = "Pay and purchases of all functions, at this month's prices"
type = "real"
unit = "GBP/month"
phase = "accounts"
expr = "sum(spending_by_function, function)"

# ------------------------------------------------------- what services deliver (stage S8.1)

[param.health_age_weight]
doc = "Health care per person by age, against people aged 45 to 64 (a judgement shaped like the OBR's profile of health spending by age)"
type = "real"
unit = "1"
dims = ["age"]
data = "functions/health_weights.csv"
column = "weight"

[param.service_adjust_months]
doc = "Months over which a service follows a change in its funding (a judgement)"
type = "real"
unit = "1"
low = 3.0
central = 6.0
high = 12.0

[var.health_need]
label = "People weighted by their need for health care"
doc = "The population, each person weighted by the health care people of that age need"
type = "real"
unit = "person"
phase = "accounts"
expr = "sum(population * health_age_weight, region, sex, age)"

[var.school_age_population]
label = "People aged 4 to 21"
type = "real"
unit = "person"
phase = "accounts"
expr = "sum(select(coord(age) >= 4 and coord(age) <= 21, population, 0.0), region, sex, age)"

[var.older_population]
label = "People aged 65 and over"
type = "real"
unit = "person"
phase = "accounts"
expr = "sum(select(coord(age) >= 65, population, 0.0), region, sex, age)"

[var.people_served]
doc = "Whom each function serves: health the population weighted by need, education people aged 4 to 21, social care people aged 65 and over, the rest everyone"
type = "real"
unit = "person"
phase = "accounts"
dims = ["function"]
expr = "select(coord(function) == 0, health_need, select(coord(function) == 1, school_age_population, select(coord(function) == 2, population_total, select(coord(function) == 3, population_total, select(coord(function) == 4, population_total, select(coord(function) == 5, older_population, select(coord(function) == 6, population_total, select(coord(function) == 7, population_total, population_total))))))))"

[var.people_served_first]
doc = "The people each function served in the first month"
type = "real"
unit = "person"
phase = "accounts"
dims = ["function"]
expr = "select(prev(people_served_first) > 0.0, prev(people_served_first), people_served)"
initial = 0.0

[var.real_spending_by_function]
doc = "Each function's spending lever: pay and purchases in 2024 prices"
type = "money"
unit = "GBP/month"
phase = "accounts"
dims = ["function"]
expr = "select(coord(function) == 0, spending_health, select(coord(function) == 1, spending_education, select(coord(function) == 2, spending_defence, select(coord(function) == 3, spending_public_order, select(coord(function) == 4, spending_transport, select(coord(function) == 5, spending_social_care, select(coord(function) == 6, spending_environment_housing, select(coord(function) == 7, spending_culture, spending_general))))))))"

[var.service_target]
doc = "Each function's real spending per person it serves, against the first month: where its service level is heading"
type = "real"
unit = "1"
phase = "accounts"
dims = ["function"]
expr = "(real_spending_by_function / function_spending) / (people_served / people_served_first)"

[var.service_level]
label = "Service level, by function"
doc = "Real spending per person served, against the first month (100%), followed over a few months"
type = "real"
unit = "1"
phase = "accounts"
dims = ["function"]
expr = "prev(service_level) + (service_target - prev(service_level)) / service_adjust_months"
initial = 1.0

[var.service_level_overall]
label = "Service level, all public services"
doc = "The functions' service levels, weighted by their spending in 2024"
type = "real"
unit = "1"
phase = "accounts"
expr = "sum(service_level * function_spending, function) / sum(function_spending, function)"
