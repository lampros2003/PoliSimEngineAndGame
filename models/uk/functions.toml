# Public spending by function (stage S8.0). GENERATED by tools/uk/calibrate.py from
# tools/uk/functions.py and models/uk/data/functions.csv (HM Treasury, PESA 2025); do not
# edit.
#
# A lever per function, in 2024 prices. Each function's pay and purchases keep their 2024
# split, and the economy reads their sums, the public pay bill and purchases, as before.

[dim.function]
members = ["health", "education", "defence", "public_order", "transport", "social_care", "environment_housing", "culture", "general"]
labels = ["Health", "Education", "Defence", "Police, courts and prisons", "Transport", "Social care", "Environment and housing", "Culture, sport and recreation", "Government and the economy"]

[param.function_pay]
doc = "Each function's pay bill, 2024, a month"
type = "money"
unit = "GBP/month"
dims = ["function"]
data = "functions/split.csv"
column = "pay"

[param.function_spending]
doc = "Each function's pay and purchases, 2024, a month"
type = "money"
unit = "GBP/month"
dims = ["function"]
data = "functions/split.csv"
column = "spending"

[param.function_products]
doc = "Domestic product bought per pound of each function's spending"
type = "real"
unit = "1"
dims = ["function", "product"]
data = "functions/products.csv"

[lever.spending_health]
label = "Health"
group = "Public services"
type = "money"
unit = "GBP/month"
default = 21654938439
range = [0, 43309876878]
leaning = "left"
doc = "The NHS and other health services: their staff and what they buy, in 2024 prices; its pay and purchases keep their 2024 split (HM Treasury, PESA 2025)"

