arge) / stance_step_prescription_charge + 0.5 * (winter_fuel_payment - stance_base_winter_fuel_payment) / stance_step_winter_fuel_payment + -0.3 * (planning_rules - stance_base_planning_rules) / stance_step_planning_rules + 1.5 * (net_wealth_tax - stance_base_net_wealth_tax) / stance_step_net_wealth_tax + 1.5 * (rail_ownership - stance_base_rail_ownership) / stance_step_rail_ownership + 0.3 * (rd_grants - stance_base_rd_grants) / stance_step_rd_grants + 0.5 * (energy_bill_help - stance_base_energy_bill_help) / stance_step_energy_bill_help + 0.7 * (free_childcare - stance_base_free_childcare) / stance_step_free_childcare + 0.3 * (farm_support - stance_base_farm_support) / stance_step_farm_support + 0.7 * (public_pay_settlement - stance_base_public_pay_settlement) / stance_step_public_pay_settlement + -1.0 * (trade_union_law - stance_base_trade_union_law) / stance_step_trade_union_law + -0.5 * (strike_limits - stance_base_strike_limits) / stance_step_strike_limits"

