[var.belief_standing]
label = "Where the government stands"
doc = "Belief groups: belief_effect times the stances, by membership. Town and countryside, each by membership less its share of adults so the mean over the electorate is nil: fuel duty (countryside -0.004 a penny above 2024, towns +0.001), cheaper buses (towns +0.01 a pound off the cap), planning (each step liberal: towns +0.005, countryside -0.008), roads and railways (towns +0.05, countryside +0.02 a unit). Judgements, nil at the 2024 settings"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "belief_effect * ((1.0 * stance_state / (1.0 + abs(stance_state))) * (1.0 * group_member[group: socialists] / group_share[group: socialists] + -1.0 * group_member[group: capitalists] / group_share[group: capitalists]) + (1.0 * stance_order / (1.0 + abs(stance_order))) * (1.0 * group_member[group: conservatives] / group_share[group: conservatives] + -1.0 * group_member[group: liberals] / group_share[group: liberals]) + (1.0 * stance_green / (1.0 + abs(stance_green))) * (1.0 * group_member[group: environmentalists] / group_share[group: environmentalists] + -1.0 * group_member[group: motorists] / group_share[group: motorists]) + (1.0 * stance_nation / (1.0 + abs(stance_nation))) * (1.0 * group_member[group: patriots] / group_share[group: patriots] + -1.0 * group_member[group: liberals] / group_share[group: liberals])) + (0.001 * (group_member[group: town] - group_share[group: town]) - 0.004 * (group_member[group: countryside] - group_share[group: countryside])) * (fuel_duty - fuel_duty_2024) / fuel_penny + 0.01 * (group_member[group: town] - group_share[group: town]) * (bus_fare_cap_2024 - bus_fare_cap) / bus_pound + (0.005 * (group_member[group: town] - group_share[group: town]) - 0.008 * (group_member[group: countryside] - group_share[group: countryside])) * (planning_rules - 2) + (0.05 * (group_member[group: town] - group_share[group: town]) + 0.02 * (group_member[group: countryside] - group_share[group: countryside])) * (spending_transport / spending_transport_2024 - 1.0)"

[var.voter_conditions]
label = "What the new groups of work and place feel of their conditions"
doc = "Public sector workers: public pay against prices (0.5 a unit) and the public pay bill, which sets their jobs (0.2 a unit); trade unionists 0.3 and 0.1; farmers: farm incomes (0.05 a unit); each times the membership of the group over its share of adults, so the types where it is over-represented feel it. Renters: real rents (-0.2 a unit); home owners: real house prices (+0.1 a unit); motorists: congestion (-0.05 a unit); low incomes and pensioners: energy bills (-0.1 a unit); everyone: strikes (-0.005 for each multiple of the 2024 level). Judgements, each against 2024 and so nil in the base month; a fundamental like jobs and prices, not a reaction to a decision"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "group_member[group: public_sector] / group_share[group: public_sector] * (0.5 * (public_real_pay - 1.0) + 0.2 * (public_pay_bill / public_pay_2024 - 1.0)) + group_member[group: trade_unionists] / group_share[group: trade_unionists] * (0.3 * (public_real_pay - 1.0) + 0.1 * (public_pay_bill / public_pay_2024 - 1.0)) + 0.05 * group_member[group: farmers] / group_share[group: farmers] * (farm_income_change) - 0.2 * group_member[group: renters] * (real_rents - 1.0) + 0.1 * group_member[group: home_owners] * (house_price_change) - 0.05 * group_member[group: motorists] * (congestion / congestion_2024 - 1.0) - 0.1 * (group_member[group: low_income] + group_member[group: pensioner]) * (energy_bill_change) - 0.005 * (strike_days / strike_days_2024 - 1.0)"

[param.bus_pound]
type = "money"
