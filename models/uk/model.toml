# The United Kingdom, national books, version 0 (stage S3.2).
#
# GENERATED by tools/uk/calibrate.py from tools/uk/template/. Edit the template, not this
# file. Opening values in {{double braces}} in the template come from the base year's accounts
# (models/uk/data/) and tools/uk/assumptions.toml.
#
# Five sectors as in the UK sector accounts: households (with non-profit institutions),
# firms (non-financial corporations), financial corporations, the public sector and the
# rest of the world. Three financial instruments: money (deposits, issued by financial
# corporations), gilts (issued by the public sector) and loans (owed by firms to financial
# corporations). Every payment moves money from one sector to another; the public sector
# sells gilts to cover its deficit and firms borrow to keep their cash at its usual level.
#
# Contains public sector information licensed under the Open Government Licence v3.0.

[model]
id = "uk"
format = 1
title = "United Kingdom"
currency = "GBP"
minor_units = 100
step = "month"
phases = ["labour", "alignment", "income", "spending", "finance", "accounts", "politics"]
files = ["calibration.toml", "economy.toml", "population.toml", "industries.toml", "households.toml", "politics.toml", "trade.toml", "functions.toml", "emissions.toml", "nhs.toml", "prices.toml", "situations.toml", "dilemmas.toml", "capital.toml"]

[sector.households]
label = "Households"

[sector.firms]
label = "Firms"

[sector.banks]
label = "Financial corporations"

[sector.government]
label = "Public sector"

[sector.rest_of_world]
label = "Rest of the world"

[instrument.money]
unit = "GBP"
issuer = "banks"

[instrument.gilts]
unit = "GBP"
issuer = "government"

[instrument.loans]
unit = "GBP"
issuer = "firms"

[account.household_money]
label = "Household deposits"
sector = "households"
instrument = "money"
initial = 1900000000000

[account.firm_money]
label = "Firms' deposits"
sector = "firms"
instrument = "money"
initial = 800000000000

[account.bank_money]
label = "Deposits owed by financial corporations"
sector = "banks"
instrument = "money"

[account.government_money]
label = "Public sector cash"
sector = "government"
instrument = "money"
initial = 0

[account.foreign_money]
label = "Deposits held from abroad"
sector = "rest_of_world"
instrument = "money"
initial = 500000000000

[account.gilts_issued]
label = "Gilts in issue (public debt)"
sector = "government"
instrument = "gilts"

[account.bank_gilts]
label = "Gilts held by financial corporations"
sector = "banks"
instrument = "gilts"
initial = 2055972000000

[account.foreign_gilts]
label = "Gilts held abroad"
sector = "rest_of_world"
instrument = "gilts"
initial = 760428000000

[account.firm_loans]
label = "Firms' bank borrowing"
sector = "firms"
instrument = "loans"

[account.bank_loans]
label = "Loans to firms"
sector = "banks"
instrument = "loans"
initial = 500000000000

# ------------------------------------------------------------------ slow-moving states
# Updated at the end of each month, so the first month uses the opening values exactly.

# ================================================================= inputs
# Set by scenarios, never by the player (player = false): what the model takes as given
# from outside. A historical run (tools/uk/hindcast.py) sets them month by month to follow
# the published figures; their defaults change nothing.

[lever.labour_force_shock]
label = "Labour force growth beyond trend"
type = "real"
unit = "1"
default = 0.0
range = [-0.05, 0.05]
player = false
doc = "Added to the labour force's growth this month: migration and participation beyond the trend"

[lever.export_demand]
label = "World demand for exports, relative to trend"
type = "real"
unit = "1"
default = 1.0
range = [0.2, 5.0]
player = false
doc = "Multiplies exports: world demand above or below its trend"

[lever.gilt_yield_shift]
label = "Gilt yield above the assumption"
type = "real"
unit = "1"
default = 0.0
range = [-0.1, 0.2]
player = false
doc = "Added to gilt_yield, the annual rate on new gilts: where the market has it"

[lever.spending_shift]
label = "Household spending out of income, change"
type = "real"
unit = "1"
default = 0.0
range = [-0.3, 0.3]
player = false
doc = "Added to the share of income households spend: confidence, credit conditions, lockdowns"

[lever.investment_demand]
label = "Business investment, relative to usual"
type = "real"
unit = "1"
default = 1.0
range = [0.2, 3.0]
player = false
doc = "Multiplies business investment: confidence and credit conditions"

[lever.import_propensity]
label = "Imports, relative to usual"
type = "real"
unit = "1"
default = 1.0
range = [0.2, 3.0]
player = false
doc = "Multiplies imports: the exchange rate and relative prices, which the model does not have"

[lever.labour_share]
label = "Labour share of sales, relative to usual"
type = "real"
unit = "1"
default = 1.0
range = [0.5, 1.5]
player = false
doc = "Multiplies the share of sales firms spend on pay, and so the employment their sales justify"

[lever.pay_shock]
label = "Pay growth beyond prices and productivity"
type = "real"
unit = "1"
default = 0.0
range = [-0.05, 0.05]
player = false
doc = "Added to this month's growth of private sector pay"

[lever.inflation_shock]
label = "Price shock this month"
type = "real"
unit = "1"
default = 0.0
range = [-0.05, 0.05]
player = false
doc = "Added to this month's inflation: energy and import prices, which the model does not generate"

[state.price_index]
label = "Price level (2024 = 1)"
type = "real"
unit = "1"
phase = "accounts"
initial = 1.0
next = "price_index * (1.0 + inflation)"

[state.private_pay_per_worker]
label = "Average private sector pay"
type = "real"
unit = "GBP/month/person"
phase = "accounts"
initial = 350975.915680092
next = "private_pay_per_worker * (1.0 + inflation + productivity_growth + wage_curve * (natural_unemployment - unemployment_rate) + pay_shock + wage_catchup * price_wedge_growth)"

[state.trend_index]
label = "Trend size of the economy (2024 = 1)"
type = "real"
unit = "1"
phase = "accounts"
doc = "Grows at target inflation plus trend real growth; amounts set by policy are scaled by it"
initial = 1.0
next = "trend_index * (1.0 + inflation_target + productivity_growth + labour_force_growth)"

[state.world_index]
label = "World demand (first month = 1)"
type = "real"
unit = "1"
phase = "accounts"
initial = 1.0
next = "world_index * (1.0 + world_growth)"

[state.labour_force]
label = "Labour force"
type = "real"
unit = "person"
phase = "accounts"
initial = 35128000.0
next = "labour_force * (1.0 + labour_force_growth + labour_force_shock)"

[state.effective_rate]
label = "Average interest rate on public debt"
type = "real"
unit = "1"
phase = "accounts"
initial = 0.043770771197
next = "effective_rate + (gilt_yield + gilt_yield_shift - effective_rate) / maturity_months"

[state.private_employment]
label = "Private sector employment"
type = "real"
unit = "person"
phase = "accounts"
initial = 26718096.35473867
next = "private_employment + hiring_speed * ((labour_force - public_employment) * curve(wage_share * labour_share * private_demand / private_pay_per_worker / (labour_force - public_employment), labour_capacity) - private_employment)"

# Stage S11.3: how much of firms' demand for workers the labour market can fill, a judgement
# (docs/S11-PLAN.md). Demand and filled jobs are shares of the workers not employed by the
# state. Up to 95.5% (unemployment around 3.7%, below 2024's 4.3%) every job wanted is
# filled, as before; beyond, it gets harder, and at most 98% of those workers are employed:
# some are always between jobs, so unemployment cannot fall much below 2%.
[table.labour_capacity]
kind = "curve"
x_unit = "1"
unit = "1"
points = [{ x = 0.0, y = 0.0 }, { x = 0.955, y = 0.955 }, { x = 1.0, y = 0.97 }, { x = 1.1, y = 0.977 }, { x = 1.3, y = 0.98 }]
