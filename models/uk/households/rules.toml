phase = "rules"
entity = "household"
expr = "select(children >= 1, uc_work_allowance, 0)"

[var.universal_credit]
type = "money"
unit = "GBP/month/household"
phase = "rules"
entity = "household"
expr = "select(age1 < state_pension_age, max(uc_standard + uc_children - round(uc_taper * max(uc_net_earnings - uc_work_allowed, 0)) - uc_unearned, 0), 0)"
doc = "Universal Credit, a month (no housing element)"

[var.income_tax_total]
label = "Income tax"
