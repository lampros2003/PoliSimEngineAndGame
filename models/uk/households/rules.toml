[var.uc_couple_unit]
type = "bool"
unit = "1"
phase = "rules"
entity = "household"
expr = "adults >= 2 and (type >= 3 and type <= 6 or type == 9)"

[var.uc_standard]
type = "money"
unit = "GBP/month/household"
phase = "rules"
entity = "household"
expr = "select(uc_couple_unit, select(age1 < 25 and age2 < 25, uc_couple_young, uc_couple), select(age1 < 25, uc_single_young, uc_single))"

[var.uc_children]
type = "money"
unit = "GBP/month/household"
phase = "rules"
entity = "household"
expr = "uc_child * min(children, uc_child_limit) + select(children >= 1 and youngest_child >= 7, uc_first_child_older - uc_child, 0)"

[var.uc_net_earnings]
type = "money"
unit = "GBP/month/household"
phase = "rules"
entity = "household"
expr = "round((earn1 - income_tax1 - employee_ni1 + select(uc_couple_unit, earn2 - income_tax2 - employee_ni2, 0)) / year)"

[var.uc_unearned]
type = "money"
unit = "GBP/month/household"
phase = "rules"
entity = "household"
expr = "round((pens1 + select(uc_couple_unit, pens2, 0)) / year)"

[var.uc_work_allowed]
