type = "money"
unit = "GBP/year/household"
phase = "rules"
entity = "household"
expr = "round((1.0 * child_benefit_year) * clamp((1.0 * top_income - hicbc_start) / (1.0 * hicbc_width), 0.0, 1.0))"
