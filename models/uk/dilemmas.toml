# The questions put to the government (stage S9.2), model format 1 (docs/spec/06-model-
# format-1.md, Dilemmas). GENERATED: copied from tools/uk/template/dilemmas.toml by
# tools/uk/calibrate.py.
#
# Each dilemma opens when its start holds and stays open until it is answered; each answer
# changes formulas the model already has, for some months or for good. An effect that
# reads the dilemma's own `_age` can fade on its own clock while the rest of the answer
# lasts. The sizes are judgements, listed in models/uk/README.md. Costs are shares of an
# existing payment, at 2024 sizes: 1% of procurement is about £3.3bn a year, of public
# investment £1.4bn, of subsidies £0.4bn, of public pay £2.9bn, of benefits £3.1bn.
#
# What an answer does to how voters see the government goes through government_standing
# (politics.toml), by voter type: type_region (0 North East, 1 North West, 2 Yorkshire and
# The Humber ... 9 Wales, 10 Scotland, 11 Northern Ireland), type_age (0 for 18 to 24 ... 4
# for 65 and over), type_quintile (0 for the poorest fifth) and type_in_work. A standing of
# -0.02 weighs on a voter type as much as about a third of a point more unemployment in its
# region, or ten months more in office.
#
# Chance events draw from their own random streams, so the same seed brings them in the
# same month.

[stream.energy_shock_chance]

[stream.investor_chance]

[stream.floods_chance]

[stream.steel_chance]

[stream.universities_chance]

[stream.water_chance]

[stream.fuel_protest_chance]

[stream.small_boats_chance]

[stream.gilt_crisis_chance]

# ---------------------------------------------------------------- the pay round

[dilemma.pay_claim]
label = "Public sector pay claim"
doc = "The pay review bodies report, and unions for nurses, teachers and civil servants ask for a rise well above plans after years of pay falling behind prices; several ballot for strikes"
start = "months_elapsed >= 6"

[[dilemma.pay_claim.option]]
name = "meet"
label = "Meet the claim"
doc = "Public sector pay rises 4% above plans, for good: about £12bn a year. No strikes"
effect = { public_pay = "round({base} * 1.04)" }

[[dilemma.pay_claim.option]]
name = "split"
label = "Offer half"
doc = "Pay rises 2% above plans, for good. Some unions strike for three months: hospitals treat 5% fewer patients"
effect = { public_pay = "round({base} * 1.02)", treatments = "{base} * select(pay_claim_age < 3, 0.95, 1.0)" }

[[dilemma.pay_claim.option]]
name = "refuse"
label = "Hold to the plans"
doc = "No more than planned. Doctors, nurses and teachers strike on and off for six months: hospitals treat a tenth fewer patients and schools lose days, and voters tire of the disruption"
months = 6
effect = { treatments = "{base} * 0.9", service_target = "select(coord(function) == 1, {base} * 0.95, {base})", government_standing = "{base} - 0.01" }

# ---------------------------------------------------------------- the NHS

[dilemma.nhs_winter]
label = "NHS winter crisis"
doc = "The waiting list is the longest there has ever been, ambulances queue outside hospitals and the NHS asks for emergency help"
start = "waiting_list > record_waiting_list and months_elapsed >= 9"
# Stage S13.7: two years before it comes again (it was one), so a record list is not the
# same question every winter.
