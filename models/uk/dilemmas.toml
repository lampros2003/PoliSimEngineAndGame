[[dilemma.nhs_winter.option]]
name = "fund"
label = "Emergency funding"
doc = "About £3.3bn a year more for six months: hospitals treat 5% more patients"
months = 6
effect = { procurement = "round({base} * 1.01)", treatments = "{base} * 1.05" }

[[dilemma.nhs_winter.option]]
name = "private"
label = "Buy operations from private hospitals"
doc = "About £1.6bn a year for a year: 3% more patients treated"
months = 12
effect = { procurement = "round({base} * 1.005)", treatments = "{base} * 1.03" }

[[dilemma.nhs_winter.option]]
name = "wait"
label = "Ride it out"
doc = "No new money. Older voters, who use the NHS most, hold it against the government for six months"
months = 6
effect = { government_standing = "{base} - select(type_age == 4, 0.04, select(type_age == 3, 0.02, 0.0))" }

