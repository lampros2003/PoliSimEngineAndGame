# ---------------------------------------------------------------- stage S13.8: lenders refuse
# Stage S14.5: a chance each month that rises with borrowing, averaged over a year, above its
# level at the start of the game (finances.toml, gilt_crisis_odds): small a point above, near
# certain within a year at three. (S13.8 opened it at a line, 1.2 points, which a government
# just under it never met.)

[dilemma.gilt_crisis]
label = "Lenders refuse the gilts"
doc = "With borrowing far above where it started and still rising, a gilt auction fails: lenders will only take the government's debt at a much higher price, and the pound falls"
start = "months_elapsed >= 12 and rand(gilt_crisis_chance) < gilt_crisis_chance_now"
again_after = 36

[[dilemma.gilt_crisis.option]]
name = "budget"
label = "An emergency budget"
doc = "Cuts to plans for two years: procurement 4% and public investment 10% lower, about £20bn a year; lenders calm down, and voters resent the cuts while they last"
months = 24
effect = { procurement = "round({base} * 0.96)", public_investment = "round({base} * 0.9)", government_standing = "{base} - 0.03" }

[[dilemma.gilt_crisis.option]]
name = "hold"
label = "Hold course"
doc = "Pay what lenders ask: new gilts cost two points more for two years, the weaker pound adds about two and a half points a year to inflation for a year, and voters blame the government"
effect = { gilt_premium = "{base} + select(gilt_crisis_age < 24, 0.02, 0.0)", inflation = "{base} + select(gilt_crisis_age < 12, 0.002, 0.0)", government_standing = "{base} - select(gilt_crisis_age < 12, 0.05, 0.0)" }

[[dilemma.gilt_crisis.option]]
name = "bank"
label = "Ask the Bank of England to buy"
doc = "The Bank buys gilts with new money: lenders' premium is gone for a year, but inflation runs about three and a half points a year higher for that year, and voters notice"
months = 12
effect = { gilt_premium = "0.0 * {base}", inflation = "{base} + 0.003", government_standing = "{base} - 0.02" }
