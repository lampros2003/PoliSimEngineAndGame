# The UK's voters (stage S5.2). GENERATED by tools/uk/voters.py; do not edit.
# Who votes for which bloc: the households' adults aged 18 and over in 600 voter types,
# with a multinomial logit over nine blocs and not voting (models/uk/politics/README.md).

[dim.option]
members = ["centre_left", "centre_right", "liberal", "populist_right", "green", "scottish_nationalist", "welsh_nationalist", "northern_ireland", "other", "abstain"]
labels = ["Centre-left", "Centre-right", "Liberal", "Populist right", "Green", "Scottish nationalist", "Welsh nationalist", "Northern Ireland parties", "Others", "Would not vote"]

[dim.bloc]
doc = "The blocs: the first nine options"
members = ["centre_left", "centre_right", "liberal", "populist_right", "green", "scottish_nationalist", "welsh_nationalist", "northern_ireland", "other"]
labels = ["Centre-left", "Centre-right", "Liberal", "Populist right", "Green", "Scottish nationalist", "Welsh nationalist", "Northern Ireland parties", "Others"]

[dim.voter_age]
members = ["age_18_24", "age_25_34", "age_35_49", "age_50_64", "age_65_plus"]
labels = ["18 to 24", "25 to 34", "35 to 49", "50 to 64", "65 and over"]

[dim.voter_type]
doc = "Region by age band by household income quintile by in work: see politics/voter_types.csv"
range = [0, 599]

[param.voter_age_of]
type = "int"
unit = "1"
dims = ["age"]
data = "politics/voter_ages.csv"

[param.quintile_of]
type = "int"
unit = "1"
dims = ["decile"]
data = "politics/quintiles.csv"

[param.type_region]
type = "int"
unit = "1"
dims = ["voter_type"]
data = "politics/voter_types.csv"
column = "region"

[param.type_age]
type = "int"
unit = "1"
dims = ["voter_type"]
data = "politics/voter_types.csv"
column = "voter_age"

[param.option_intercept]
doc = "Fitted so that the base month reproduces the 2024 general election in every region"
type = "real"
unit = "1"
dims = ["region", "option"]
data = "politics/intercepts.csv"

[param.option_age_effect]
doc = "Assumed: turnout rises with age; the young lean centre-left and green, the old centre-right and populist right"
type = "real"
unit = "1"
dims = ["voter_age", "option"]
data = "politics/age_effects.csv"

[param.vote_income_effect]
doc = "On the governing blocs' utility, per unit of proportional change in a voter type's real household income"
type = "real"
unit = "1"
value = 2.5

[param.vote_unemployment_effect]
doc = "On the governing blocs' utility, per unit of unemployment rate above its level at the last election"
type = "real"
unit = "1"
value = -6.0

[param.vote_inflation_effect]
doc = "On the governing blocs' utility, per unit of annual inflation above its level at the last election"
type = "real"
unit = "1"
value = -3.0

[param.vote_tenure_effect]
doc = "On the governing blocs' utility, per year in office"
type = "real"
unit = "1"
value = -0.025

[state.governing]
label = "In government"
type = "bool"
unit = "1"
phase = "politics"
dims = ["bloc"]
initial = { data = "politics/governing.csv" }
next = "governing"

[state.months_in_office]
label = "Months the government has held office"
type = "int"
unit = "1"
phase = "politics"
initial = 6
next = "months_in_office + 1"

[state.unemployment_at_election]
doc = "Unemployment at the last election; the base month's stands in for July 2024's (-1 until it is known)"
type = "real"
unit = "1"
phase = "politics"
initial = -1.0
next = "select(unemployment_at_election < 0.0, unemployment_rate, unemployment_at_election)"

[state.inflation_at_election]
doc = "Inflation at the last election; the base month's stands in for July 2024's (-1 until it is known)"
type = "real"
unit = "1"
phase = "politics"
initial = -1.0
next = "select(inflation_at_election < -0.5, inflation_annual, inflation_at_election)"

# ---- each household's change in real income, the pocketbook

[var.real_net_income]
type = "real"
unit = "GBP/month/household"
phase = "politics"
entity = "household"
expr = "net_income / price_index"

[state.income_memory]
doc = "Real net income, averaged over about a year (exponentially); 0 until the first month"
type = "real"
unit = "GBP/month/household"
phase = "politics"
entity = "household"
initial = 0.0
next = "select(income_memory > 0.0, income_memory + (real_net_income - income_memory) / 12.0, real_net_income)"

[var.income_change]
doc = "Real net income against its average over about a year"
type = "real"
unit = "1"
phase = "politics"
entity = "household"
expr = "select(income_memory > 0.0 and real_net_income > 0.0, real_net_income / income_memory - 1.0, 0.0)"

# ---- voter types

[var.voters]
label = "Adults aged 18 and over, by voter type"
type = "int"
unit = "person"
phase = "politics"
dims = ["voter_type"]
expr = "wsum_by(household, select(adults >= 1 and age1 >= 18, person_each, 0), voter_type, ((region_code * 5 + voter_age_of[age: max(age1, 0)]) * 5 + quintile_of[decile: income_decile]) * 2 + select(earnings1 > 0, 1, 0)) + wsum_by(household, select(adults >= 2 and age2 >= 18, person_each, 0), voter_type, ((region_code * 5 + voter_age_of[age: max(age2, 0)]) * 5 + quintile_of[decile: income_decile]) * 2 + select(earnings2 > 0, 1, 0)) + wsum_by(household, select(adults >= 3 and age3 >= 18, person_each, 0), voter_type, ((region_code * 5 + voter_age_of[age: max(age3, 0)]) * 5 + quintile_of[decile: income_decile]) * 2 + select(earnings3 > 0, 1, 0)) + wsum_by(household, select(adults >= 4 and age4 >= 18, person_each, 0), voter_type, ((region_code * 5 + voter_age_of[age: max(age4, 0)]) * 5 + quintile_of[decile: income_decile]) * 2 + select(earnings4 > 0, 1, 0))"

[var.voter_income_change]
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "safe_div(wsum_by(household, income_change * select(adults >= 1 and age1 >= 18, person_each, 0), voter_type, ((region_code * 5 + voter_age_of[age: max(age1, 0)]) * 5 + quintile_of[decile: income_decile]) * 2 + select(earnings1 > 0, 1, 0)) + wsum_by(household, income_change * select(adults >= 2 and age2 >= 18, person_each, 0), voter_type, ((region_code * 5 + voter_age_of[age: max(age2, 0)]) * 5 + quintile_of[decile: income_decile]) * 2 + select(earnings2 > 0, 1, 0)) + wsum_by(household, income_change * select(adults >= 3 and age3 >= 18, person_each, 0), voter_type, ((region_code * 5 + voter_age_of[age: max(age3, 0)]) * 5 + quintile_of[decile: income_decile]) * 2 + select(earnings3 > 0, 1, 0)) + wsum_by(household, income_change * select(adults >= 4 and age4 >= 18, person_each, 0), voter_type, ((region_code * 5 + voter_age_of[age: max(age4, 0)]) * 5 + quintile_of[decile: income_decile]) * 2 + select(earnings4 > 0, 1, 0)), voters, 0.0)"

[var.fundamentals]
label = "The economy and time in office, on the government's utility"
type = "real"
unit = "1"
phase = "politics"
expr = "select(unemployment_at_election < 0.0, 0.0, vote_unemployment_effect * (unemployment_rate - unemployment_at_election)) + select(inflation_at_election < -0.5, 0.0, vote_inflation_effect * (inflation_annual - inflation_at_election)) + vote_tenure_effect * months_in_office / 12.0"

[var.utility]
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type", "option"]
expr = "option_intercept[region: type_region] + option_age_effect[voter_age: type_age] + select(coord(option) < 9 and governing[bloc: min(coord(option), 8)], vote_income_effect * voter_income_change + fundamentals, 0.0)"

[var.weight_of_option]
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type", "option"]
expr = "exp(utility)"

[var.weight_of_type]
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type"]
expr = "sum(weight_of_option, option)"

[var.choice]
label = "Share of each voter type choosing each option"
type = "real"
unit = "1"
phase = "politics"
dims = ["voter_type", "option"]
expr = "weight_of_option / weight_of_type"

[var.electorate_share]
label = "Share of the electorate, by option"
type = "real"
unit = "1"
phase = "politics"
dims = ["option"]
expr = "sum(voters * choice, voter_type) / sum(voters, voter_type)"

[var.turnout]
label = "Turnout"
type = "real"
unit = "1"
phase = "politics"
expr = "1.0 - electorate_share[option: abstain]"

[var.vote_intention]
label = "Voting intention"
type = "real"
unit = "1"
phase = "politics"
dims = ["bloc"]
expr = "electorate_share[option: coord(bloc)] / turnout"

[var.regional_intention]
label = "Voting intention by region"
type = "real"
unit = "1"
phase = "politics"
dims = ["region", "bloc"]
expr = "sum(select(type_region == coord(region), voters * choice[option: coord(bloc)], 0.0), voter_type) / sum(select(type_region == coord(region), voters * (1.0 - choice[option: abstain]), 0.0), voter_type)"

[var.government_support]
label = "Government's voting intention"
type = "real"
unit = "1"
phase = "politics"
expr = "sum(select(governing, vote_intention, 0.0), bloc)"
