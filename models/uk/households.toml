unit = "GBP/year/household"
bands = [{ from = "0", rate = "starter_rate" }, { from = "round(scottish_basic_threshold * price_index)", rate = "scottish_basic_rate" }, { from = "round(intermediate_threshold * price_index)", rate = "intermediate_rate" }, { from = "round(scottish_higher_threshold * price_index)", rate = "scottish_higher_rate" }, { from = "round(advanced_threshold * price_index)", rate = "advanced_rate" }, { from = "round(top_threshold * price_index)", rate = "top_rate" }]

[table.employee_ni]
kind = "marginal"
unit = "GBP/year/household"
bands = [{ from = "round(ni_primary_threshold * price_index)", rate = "ni_main_rate" }, { from = "round(ni_upper_limit * price_index)", rate = "ni_upper_rate" }]

[table.employer_ni]
