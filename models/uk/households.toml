unit = "GBP/year/household"
phase = "income"
entity = "household"
expr = "marginal(pay4, employer_ni)"

[var.income_tax_year]
type = "money"
unit = "GBP/year/household"
phase = "income"
entity = "household"
expr = "income_tax1 + income_tax2 + income_tax3 + income_tax4"
doc = "Income tax of every adult, a year"

[var.employee_ni_year]
type = "money"
unit = "GBP/year/household"
phase = "income"
entity = "household"
expr = "employee_ni1 + employee_ni2 + employee_ni3 + employee_ni4"

[var.employer_ni_year]
type = "money"
unit = "GBP/year/household"
phase = "income"
entity = "household"
expr = "employer_ni1 + employer_ni2 + employer_ni3 + employer_ni4"

[var.top_income]
type = "money"
unit = "GBP/year/household"
phase = "income"
entity = "household"
expr = "max(max(income1, income2), max(income3, income4))"

[var.child_benefit_year]
type = "money"
unit = "GBP/year/household"
phase = "income"
entity = "household"
expr = "select(children >= 1, round(child_benefit_eldest * price_index) + max(children - 1, 0) * round(child_benefit_other * price_index), 0)"

[var.hicbc_year]
type = "money"
unit = "GBP/year/household"
phase = "income"
entity = "household"
expr = "round((1.0 * child_benefit_year) * clamp((1.0 * top_income - round(hicbc_start * price_index)) / (1.0 * round(hicbc_width * price_index)), 0.0, 1.0))"
doc = "High Income Child Benefit Charge, a year"

[var.uc_couple_unit]
type = "bool"
unit = "1"
phase = "income"
entity = "household"
expr = "adults >= 2 and (type >= 3 and type <= 6 or type == 9)"

[var.uc_standard]
type = "money"
unit = "GBP/month/household"
phase = "income"
entity = "household"
expr = "select(uc_couple_unit, select(age1 < 25 and age2 < 25, round(uc_couple_young * price_index), round(uc_couple * price_index)), select(age1 < 25, round(uc_single_young * price_index), round(uc_single * price_index)))"

[var.uc_children]
type = "money"
unit = "GBP/month/household"
phase = "income"
entity = "household"
expr = "round(uc_child * price_index) * min(children, uc_child_limit) + select(children >= 1 and youngest_child >= 7, round(uc_first_child_older * price_index) - round(uc_child * price_index), 0)"

[var.uc_net_earnings]
type = "money"
unit = "GBP/month/household"
phase = "income"
entity = "household"
expr = "round((earn1 - income_tax1 - employee_ni1 + select(uc_couple_unit, earn2 - income_tax2 - employee_ni2, 0)) / year)"

[var.uc_unearned]
type = "money"
unit = "GBP/month/household"
phase = "income"
entity = "household"
expr = "round((pens1 + select(uc_couple_unit, pens2, 0)) / year)"

[var.uc_work_allowed]
type = "money"
unit = "GBP/month/household"
phase = "income"
entity = "household"
expr = "select(children >= 1, round(uc_work_allowance * price_index), 0)"

[var.universal_credit]
type = "money"
unit = "GBP/month/household"
phase = "income"
entity = "household"
expr = "select(age1 < state_pension_age, max(uc_standard + uc_children - round(uc_taper * max(uc_net_earnings - uc_work_allowed, 0)) - uc_unearned, 0), 0)"
doc = "Universal Credit, a month (no housing element)"

[var.net_income]
type = "money"
unit = "GBP/month/household"
phase = "income"
entity = "household"
expr = "round((earn1 + pens1 - income_tax1 - employee_ni1 + earn2 + pens2 - income_tax2 - employee_ni2 + earn3 + pens3 - income_tax3 - employee_ni3 + earn4 + pens4 - income_tax4 - employee_ni4 + child_benefit_year - hicbc_year) / year) + universal_credit"
doc = "Income after income tax and National Insurance, with Child Benefit and Universal Credit, a month"

[var.income_tax_total]
label = "Income tax"
type = "money"
unit = "GBP/month"
phase = "income"
expr = "round(wsum(household, income_tax_year) / year / household_unit)"

[var.employee_ni_total]
label = "National Insurance, employees and self-employed"
type = "money"
unit = "GBP/month"
phase = "income"
expr = "round(wsum(household, employee_ni_year) / year / household_unit)"

[var.employer_ni_total]
label = "National Insurance, employers"
type = "money"
unit = "GBP/month"
phase = "income"
expr = "round(wsum(household, employer_ni_year) / year / household_unit)"

[var.child_benefit_total]
label = "Child Benefit, net of the charge"
type = "money"
unit = "GBP/month"
phase = "income"
expr = "round(wsum(household, child_benefit_year - hicbc_year) / year / household_unit)"

[var.universal_credit_total]
label = "Universal Credit"
type = "money"
unit = "GBP/month"
phase = "income"
expr = "round(wsum(household, universal_credit) / household_unit)"

[param.household_unit]
doc = "Turns a sum over households (unit household) into an amount for the nation"
type = "real"
unit = "household/household"
value = 1.0

[var.income_tax_by_region]
type = "real"
unit = "GBP/month"
phase = "income"
dims = ["region"]
expr = "wsum_by(household, income_tax_year, region, region_code) / year / household_unit"

[dim.decile]
doc = "Tenths of households by equivalised gross income in the base year, poorest first"
range = [1, 10]
labels = ["Poorest tenth", "Second", "Third", "Fourth", "Fifth", "Sixth", "Seventh", "Eighth", "Ninth", "Richest tenth"]

[dim.household_type]
members = ["one_under_65", "one_65_plus", "unrelated_adults", "couple_no_children", "couple_one_or_two", "couple_three_plus", "couple_grown_children", "lone_parent", "lone_parent_grown", "multi_family"]
labels = ["One adult under 65", "One adult 65 or over", "Unrelated adults", "Couple, no children", "Couple, one or two children", "Couple, three or more children", "Couple with grown-up children", "Lone parent", "Lone parent with grown-up children", "Two or more families"]

[var.net_income_average]
label = "Net income per household, all households"
type = "real"
unit = "GBP/month/household"
phase = "income"
expr = "wsum(household, net_income) / wcount(household, true)"

[var.net_income_by_decile]
label = "Net income per household, by income decile"
type = "real"
unit = "GBP/month/household"
phase = "income"
dims = ["decile"]
expr = "wsum_by(household, net_income, decile, income_decile) / wcount_by(household, true, decile, income_decile)"

[var.net_income_by_household_type]
label = "Net income per household, by household type"
type = "real"
unit = "GBP/month/household"
phase = "income"
dims = ["household_type"]
expr = "wsum_by(household, net_income, household_type, type) / wcount_by(household, true, household_type, type)"

[var.net_income_by_region]
label = "Net income per household, by region"
type = "real"
unit = "GBP/month/household"
phase = "income"
dims = ["region"]
expr = "wsum_by(household, net_income, region, region_code) / wcount_by(household, true, region, region_code)"

# ------------------------------------------------------------------ alignment (stage S4.4)
# Each month from the second, the households' weights are raked so that they match
# households by type, people in households by region, sex and age band (the cohort table,
# times the base year's share living in households), and people in work (the economy's
# employment, times the base month's ratio). People in work come last, so they match
# exactly: the households' employment follows the economy.

[dim.age_band]
members = ["under_16", "age_16_24", "age_25_34", "age_35_49", "age_50_64", "age_65_74", "age_75_plus"]
labels = ["Under 16", "16 to 24", "25 to 34", "35 to 49", "50 to 64", "65 to 74", "75 and over"]

[dim.nation]
doc = "One member: the margin of the rake that is a national total"
members = ["uk"]

[param.person_each]
doc = "One person per household: turns a count of people in a household into people"
type = "int"
unit = "person/household"
value = 1

[param.band_of_age]
type = "int"
unit = "1"
dims = ["age"]
data = "households/age_bands.csv"

[param.in_households_share]
doc = "People in households as a share of the population, by region, sex and age band, in the base year"
type = "real"
unit = "1"
dims = ["region", "sex", "age_band"]
data = "households/alignment.csv"

[param.households_by_type_base]
doc = "Households by type in the base year"
type = "real"
unit = "household"
dims = ["household_type"]
data = "households/household_types.csv"

[param.people_in_households_base]
type = "real"
unit = "person"
value = 67361069.0

[param.workers_share]
doc = "People in work in the households against the economy's employment, in the base month"
type = "real"
unit = "1"
value = 0.9999959545481587

[lever.align_households]
label = "Keep the households in line with the population and employment"
type = "bool"
default = true
player = false

[state.alignment_months]
doc = "Months run. The households are first realigned in the second month, so the base month is the base year's"
type = "int"
unit = "1"
phase = "alignment"
initial = 0
next = "alignment_months + 1"

[var.people_in_households_target]
label = "People in households, by region, sex and age band"
type = "real"
unit = "person"
phase = "alignment"
dims = ["region", "sex", "age_band"]
expr = "in_households_share * sum(select(band_of_age == coord(age_band), population, 0.0), age)"

[var.households_by_type_target]
label = "Households by type"
type = "real"
unit = "household"
phase = "alignment"
dims = ["household_type"]
expr = "households_by_type_base * sum(people_in_households_target, region, sex, age_band) / people_in_households_base"

[var.workers_target]
label = "People in work in the households"
type = "real"
unit = "person"
phase = "alignment"
dims = ["nation"]
expr = "workers_share * (private_employment + public_employment)"

[state.household_weight]
label = "Household weight"
entity = "household"
type = "int"
unit = "1"
phase = "alignment"
initial = { column = "weight" }

[state.household_weight.rake]
when = "align_households and alignment_months >= 1"
passes = 10

[[state.household_weight.rake.margin]]
target = "households_by_type_target"
slots = [{ count = "1", at = ["type"] }]

[[state.household_weight.rake.margin]]
target = "people_in_households_target"
slots = [
  { count = "select(adults >= 1, person_each, 0)", at = ["region_code", "max(sex1, 0)", "band_of_age[age: max(age1, 0)]"] },
  { count = "select(adults >= 2, person_each, 0)", at = ["region_code", "max(sex2, 0)", "band_of_age[age: max(age2, 0)]"] },
  { count = "select(adults >= 3, person_each, 0)", at = ["region_code", "max(sex3, 0)", "band_of_age[age: max(age3, 0)]"] },
  { count = "select(adults >= 4, person_each, 0)", at = ["region_code", "max(sex4, 0)", "band_of_age[age: max(age4, 0)]"] },
  { count = "girls * person_each", at = ["region_code", "0", "0"] },
  { count = "boys * person_each", at = ["region_code", "1", "0"] },
  { count = "older_girls * person_each", at = ["region_code", "0", "1"] },
  { count = "older_boys * person_each", at = ["region_code", "1", "1"] },
]

[[state.household_weight.rake.margin]]
target = "workers_target"
slots = [{ count = "(select(earnings1 > 0, 1, 0) + select(earnings2 > 0, 1, 0) + select(earnings3 > 0, 1, 0) + select(earnings4 > 0, 1, 0)) * person_each", at = ["0"] }]

[var.households_total]
label = "Households"
type = "int"
unit = "household"
phase = "income"
expr = "wcount(household, true)"

[var.workers_in_households]
label = "People in work, in the households"
type = "int"
unit = "person"
phase = "income"
expr = "wsum(household, (select(earnings1 > 0, 1, 0) + select(earnings2 > 0, 1, 0) + select(earnings3 > 0, 1, 0) + select(earnings4 > 0, 1, 0)) * person_each)"
