[table.rest_of_uk_income_tax]
kind = "marginal"
unit = "GBP/year/household"
bands = [{ from = "0", rate = "basic_rate" }, { from = "round(higher_threshold * price_index)", rate = "higher_rate" }, { from = "round(additional_threshold * price_index)", rate = "additional_rate" }]

[table.scottish_income_tax]
